<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f9fe0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jaktmarken</title>
<style>
:root{
  --line:#3b4d6b; --line2:#5571a0; --txt:#eef3fb; --muted:#9fb1cb; --gold:#ffd25a;
  --good:#5ee07a; --bad:#ff6b6b; --panel:rgba(15,22,35,.82); --pborder:rgba(160,190,230,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7cc6f5;color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}
h2{margin:0 0 10px;font-size:20px}
.btn{background:linear-gradient(#3f6fb8,#2c5394);border:1px solid #6d9be0;border-radius:8px;padding:8px 14px;color:#fff;font-weight:700;box-shadow:0 2px 0 #1b3563}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
.btn.sec{background:linear-gradient(#3a4558,#2a3343);border-color:#56637a;box-shadow:0 2px 0 #151b25}
.btn.gold{background:linear-gradient(#f1bd3b,#c18714);border-color:#ffd36b;box-shadow:0 2px 0 #6e4a07;color:#2b1c00}
.btn.red{background:linear-gradient(#c04848,#8f2c2c);border-color:#ff8a8a;box-shadow:0 2px 0 #4d1515}
.btn.green{background:linear-gradient(#3fae55,#257a37);border-color:#7ee08f;box-shadow:0 2px 0 #134a1f}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.wide{width:100%;margin-top:10px;padding:11px}
.link{background:none;border:none;color:#9cc6ff;text-decoration:underline;padding:4px 0;font-size:13px}

/* ---------- Skärmar (inloggning / gubbval / skapa) ---------- */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px;background:linear-gradient(rgba(10,20,40,.10),rgba(10,20,40,.45))}
.card{background:rgba(20,28,42,.95);border:1px solid var(--line2);border-radius:14px;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.45);width:min(780px,96vw);max-height:94vh;overflow:auto;touch-action:pan-y}
.card.narrow{width:min(400px,94vw)}
.logo{font-size:44px;font-weight:900;letter-spacing:1px;text-align:center;margin:0;background:linear-gradient(#fff6c8,#ffb341);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3d00)}
.sub{text-align:center;color:var(--muted);margin:2px 0 14px;font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #4a5f85;background:#0e1522;color:#fff;font-size:16px;outline:none}
.inp:focus{border-color:#8fb8ff}
.savemode{margin-top:12px;font-size:12.5px;color:var(--muted);background:#0f1724;border:1px solid #2c3a55;border-radius:8px;padding:8px 10px;line-height:1.4}
.msg{min-height:18px;margin-top:8px;font-size:13px;color:#ffcf7a}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#22324d;border:1px solid #3e5680;border-radius:999px;padding:4px 10px;font-size:12px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.ccard{background:#141d2d;border:2px solid #33456a;border-radius:12px;padding:8px;text-align:center;cursor:pointer;position:relative}
.ccard:hover{border-color:#6d9be0}
.ccard canvas{width:100px;height:110px}
.ccard .cn{font-weight:800}
.ccard .cl{font-size:12px;color:var(--muted)}
.ccard .del{position:absolute;right:6px;top:6px;background:#2a1820;border:1px solid #6a3040;border-radius:6px;font-size:12px;padding:2px 6px}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.clcard{background:#141d2d;border:2px solid #33456a;border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.clcard.on{border-color:#ffd25a;box-shadow:0 0 14px rgba(255,210,90,.3)}
.clcard canvas{width:90px;height:100px}
.clcard b{display:block;font-size:16px}
.clcard p{font-size:12px;color:#c4d0e3;margin:6px 0 0;line-height:1.35}
@media (max-width:620px){.classes{grid-template-columns:1fr}.clcard{display:flex;gap:10px;align-items:center;text-align:left}.clcard canvas{width:60px;height:70px;flex:none}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
#mmWrap{position:absolute;left:8px;top:8px;background:var(--panel);border:1px solid var(--pborder);border-radius:8px;padding:4px 6px 6px}
#mapName{font-size:12px;font-weight:800;color:#ffe9a8;margin:0 0 3px 2px;text-shadow:0 1px 0 #000}
#minimap{display:block;width:200px;height:66px;border-radius:4px}
#topBtns{position:absolute;right:8px;top:8px;display:flex;gap:6px}
#topBtns button{position:relative;width:46px;height:46px;border-radius:10px;background:var(--panel);border:1px solid var(--pborder);font-size:21px;display:flex;align-items:center;justify-content:center;padding:0}
#topBtns button span{position:absolute;right:4px;bottom:1px;font-size:10px;color:#cfe0ff;font-weight:800}
.dot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#ffd23f;box-shadow:0 0 6px #ffd23f}
#status{position:absolute;left:8px;bottom:22px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--pborder);border-radius:10px;padding:6px 10px}
#lvl{font-weight:900;font-size:19px;color:#ffe066;text-shadow:0 2px 0 #6b4a00;white-space:nowrap}
.nm{display:flex;flex-direction:column;line-height:1.15;min-width:70px;max-width:120px;overflow:hidden}
.nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--muted);font-size:11px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{position:relative;width:200px;height:16px;background:#0b0f18;border:1px solid #000;border-radius:5px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .15s}
.bar.hp i{background:linear-gradient(#ff8080,#d22f35)} .bar.mp i{background:linear-gradient(#86b9ff,#2d6fe0)}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;font-weight:800;text-shadow:0 1px 1px #000}
.goldbox{font-weight:800;color:var(--gold);white-space:nowrap}
#expBar{position:absolute;left:0;right:0;bottom:0;height:15px;background:#141a24;border-top:1px solid #000}
#expBar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe680,#f0b400);transition:width .2s}
#expBar span{position:absolute;inset:0;text-align:center;font-size:10.5px;line-height:15px;font-weight:800;text-shadow:0 1px 1px #000}
#hotbar{position:absolute;right:8px;bottom:22px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--pborder);border-radius:10px;padding:5px}
.hs{position:relative;width:44px;height:44px;border-radius:8px;background:#0e1420;border:1px solid #3a4a66;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;overflow:hidden}
.hs .k{position:absolute;left:3px;top:1px;font-size:10px;font-weight:800;color:#cfe0ff;z-index:2;text-shadow:0 1px 1px #000}
.hs .ic{position:relative;z-index:1}
.cd{position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:inherit}
.cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;z-index:3;text-shadow:0 1px 2px #000;pointer-events:none}
.hs.nomana .ic,.tbtn.nomana span{filter:grayscale(.8) brightness(.55)}
.hs.assign{box-shadow:0 0 0 2px #ffd23f inset}
#log{position:absolute;left:10px;bottom:100px;width:min(440px,60vw);display:flex;flex-direction:column;gap:2px;pointer-events:none!important}
.lg{font-size:12.5px;text-shadow:0 1px 2px #000,0 0 3px #000;transition:opacity 1s;font-weight:600}
.lg.fade{opacity:0}
#buffs{position:absolute;left:10px;bottom:78px;display:flex;gap:6px;pointer-events:none!important}
.buff{background:var(--panel);border:1px solid #ff9ad5;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}

/* ---------- Fönster ---------- */
.win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:max-content;background:linear-gradient(#1c2638,#131a27);border:1px solid #4f6890;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);max-width:97vw;max-height:94vh;display:flex;flex-direction:column}
.whead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px 7px 14px;background:linear-gradient(#2c3c5a,#223049);border-bottom:1px solid #3d5275;border-radius:12px 12px 0 0;font-weight:800;cursor:move;touch-action:none;flex:none}
.whead .x{background:#3a2430;border:1px solid #7a4050;border-radius:7px;width:32px;height:30px;padding:0}
.wbody{padding:10px 12px;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#win-bag .wbody{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.slot{position:relative;width:46px;height:46px;border-radius:8px;background:radial-gradient(#253149,#151c2a);border:2px solid #34425c;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.slot img{width:40px;height:40px;pointer-events:none}
.slot .lbl{font-size:9px;color:#6f819e;text-align:center;line-height:1.05;pointer-events:none}
.slot.blank{cursor:default}
.r-common{border-color:#8a8f98}.r-uncommon{border-color:#3fbf4a}.r-rare{border-color:#3d84f5}.r-epic{border-color:#a855f7}.r-legendary{border-color:#ff9d2b;box-shadow:0 0 8px rgba(255,157,43,.55)}
.slot.sel{outline:2px solid #fff;outline-offset:1px}
.slot.cant::after{content:'';position:absolute;inset:0;background:rgba(210,40,40,.3);border-radius:6px;pointer-events:none}
.doll{display:flex;gap:8px}
.dcol{display:flex;flex-direction:column;gap:5px}
.dmid{width:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#2a3a58,#141c2b);border-radius:10px;border:1px solid #33456a;padding:6px}
#portrait{width:120px;height:150px}
.pname{font-weight:800;margin-top:2px;text-align:center;word-break:break-word}
.pcls{font-size:12px;color:var(--muted)}
.statlist{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:12.5px;margin-top:8px;background:#0f1520;border:1px solid #2c3a55;border-radius:8px;padding:8px 10px;max-width:330px}
.statlist .main{color:#ffe08a}
.statlist .full{grid-column:1/-1;color:var(--muted);font-size:11.5px;margin-top:3px}
.bagpane{width:calc(8 * 46px + 7 * 5px)}
.baghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:800}
.baghead small{color:var(--muted);font-weight:600}
.goldtxt{color:var(--gold)}
.baggrid{display:grid;grid-template-columns:repeat(8,46px);gap:5px}
.detail{margin-top:8px;min-height:64px;background:#0f1520;border:1px solid #2c3a55;border-radius:8px;padding:8px 10px;font-size:13px}
.detail .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.detail .hintx{color:var(--muted);font-size:12px}
@media (max-width:820px){.bagpane{width:calc(6 * 46px + 5 * 5px)}.baggrid{grid-template-columns:repeat(6,46px)}}
#tip{position:fixed;z-index:60;pointer-events:none;background:rgba(10,14,22,.97);border:1px solid #5a6f94;border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:250px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.tt-name{font-weight:800;font-size:14px}
.tt-sub{color:var(--muted);font-size:11.5px;margin-bottom:4px}
.tt-stat{color:#7ee787}
.bad{color:var(--bad)} .good{color:var(--good)}
.tt-sell{color:var(--gold);margin-top:4px}
.tt-cmp{margin-top:6px;padding-top:5px;border-top:1px solid #2c3a55;color:#9fb1cb;font-size:11.5px}
.warn{color:#ffb86b;font-size:11.5px;margin-top:3px}
/* Talanger */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid #33456a;margin-bottom:8px}
.tab{padding:6px 12px;border-radius:8px 8px 0 0;background:#1a2334;border:1px solid #33456a;border-bottom:none;color:#c9d6ea;font-weight:800}
.tab.on{background:#2f4468;color:#fff}
.tab.lock{opacity:.55}
.tinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.tinfo b{color:#ffe08a}
.tier{display:flex;align-items:center;gap:12px;padding:12px 10px 14px;border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,.03);border:1px solid #2c3a55}
.tier.locked{opacity:.6}
.tlabel{width:74px;font-weight:900;color:#ffe08a;font-size:16px;flex:none}
.tlabel small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.2}
.tnode{position:relative;width:96px;padding:8px 4px 8px;border-radius:10px;background:#162033;border:2px solid #3a4a66;text-align:center;cursor:pointer}
.tnode .ic{font-size:28px;display:block;line-height:34px}
.tnode .rk{position:absolute;right:4px;bottom:-10px;background:#0b0f18;border:1px solid #556;border-radius:6px;padding:0 5px;font-size:11px;font-weight:900}
.tnode .tn{font-size:11.5px;line-height:1.1;margin-top:2px;font-weight:700}
.tnode .act{position:absolute;left:4px;top:2px;font-size:9px;color:#9fd0ff;font-weight:800}
.tnode.can{border-color:#5ee07a;box-shadow:0 0 10px rgba(94,224,122,.35)}
.tnode.max{border-color:#ffd23f}
.tnode.max .rk{color:#ffd23f}
.tnode.lockd{filter:grayscale(1);opacity:.65}
.tnode.sel{outline:2px solid #fff;outline-offset:1px}
.tdetail{background:#0f1520;border:1px solid #2c3a55;border-radius:8px;padding:8px 10px;font-size:13px;min-height:64px;margin-bottom:8px;max-width:520px}
.tdetail .nx{color:#9fd0ff;margin-top:4px}
.abils{margin-top:6px;background:#0f1520;border:1px solid #2c3a55;border-radius:8px;padding:8px 10px;font-size:13px;max-width:520px}
.arow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #1e2a40}
.arow:last-child{border-bottom:none}
.arow .ai{font-size:20px;width:26px;text-align:center}
.arow .an{flex:1}
.arow .ak{color:var(--muted);font-size:12px}
.lockedtree{padding:30px 16px;text-align:center;color:var(--muted)}
/* Butik */
.srow{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #1e2a40}
.srow .sn{flex:1;min-width:0}
.srow .sn small{display:block;color:var(--muted);font-size:11px}
.srow .sp{color:var(--gold);font-weight:800;white-space:nowrap}
.shopinfo{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4;max-width:460px}
.menubody{display:flex;flex-direction:column;gap:8px;min-width:280px;max-width:420px}
.menubody details{background:#0f1520;border:1px solid #2c3a55;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5}
.menubody summary{cursor:pointer;font-weight:800}
.kbd{display:inline-block;background:#26324a;border:1px solid #4a5f85;border-radius:4px;padding:0 5px;font-size:12px;font-weight:700}

/* Förbrukningsvaror, scrolls, monsterbok */
.r-cons{border-color:#6c7c98}
.cnt{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 2px #000;pointer-events:none;z-index:3}
.hs .hi{width:30px;height:30px;display:block}
.slot.elig{box-shadow:0 0 0 2px #7dff8a,0 0 10px rgba(125,255,138,.6)}
.slot.inelig{opacity:.35}
.plus{color:#ffe066}
.bookhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tiers{display:flex;gap:4px;flex-wrap:wrap}
.tierp{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid #3e5680;background:#16203a;color:#9fb1cb}
.tierp.on{background:#2d5a2f;border-color:#7ee08f;color:#fff}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-width:920px}
.bcard{background:#141d2d;border:2px solid #33456a;border-radius:12px;padding:8px 10px;font-size:12.5px}
.bcard canvas{display:block;width:120px;height:90px;margin:0 auto}
.bcard .bn{font-weight:900;font-size:15px;text-align:center}
.bstars{text-align:center;color:#ffd23f;letter-spacing:2px}
.bk{margin-top:2px}
.bprog{height:6px;background:#0b0f18;border-radius:4px;overflow:hidden;margin:3px 0}
.bprog i{display:block;height:100%;background:linear-gradient(90deg,#4fdc5b,#ffd23f)}
.binfo{margin-top:6px;padding-top:6px;border-top:1px solid #26344f;line-height:1.5}
.bdrop{display:flex;align-items:center;gap:6px}
.bdrop img{width:22px;height:22px}
.bdrop span{margin-left:auto;color:#9fb1cb}
.lockedtxt{color:#9fb1cb}
.tbtn.pot{width:52px;height:52px}
.tbtn.pot img{width:30px;height:30px;position:relative;z-index:1}
.pot0{right:270px;bottom:20px}.pot1{right:270px;bottom:82px}

/* Party & sidoflöde för EXP/guld */
#rightCol{position:absolute;right:8px;top:62px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none!important;max-width:60vw}
#gainFeed{display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none}
#questLog{pointer-events:auto;background:var(--panel);border:1px solid var(--pborder);border-radius:10px;padding:6px 10px;min-width:190px;max-width:260px;font-size:12.5px;cursor:pointer}
#questLog .qh{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.5px;margin-bottom:2px}
#questLog .ql b{display:block}
#questLog .ok{color:#7ee787}
#questLog .ql.offer{color:#ffe066}
#questLog .ql.done b{color:#7ee787}
.qgoal{display:flex;justify-content:space-between;gap:10px}
.qgoal.ok{color:#7ee787}
.qchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.qchoice{background:#141d2d;border:2px solid #3fbf4a;border-radius:10px;padding:8px;text-align:center;cursor:pointer}
.qchoice:hover{filter:brightness(1.15)}
.qchoice img{width:48px;height:48px}
.qchoice small{display:block;color:var(--muted)}
#questBody{min-width:300px;max-width:520px;font-size:13.5px;line-height:1.45}
.gf{font-size:13px;font-weight:800;color:#ffe066;text-shadow:0 1px 2px #000,0 0 3px #000;transition:opacity .8s;white-space:nowrap}
.gf.gold{color:#ffd25a}.gf.party{color:#9fe0ff}
.gf.fade{opacity:0}
#partyHud{position:absolute;left:8px;top:112px;display:flex;flex-direction:column;gap:4px;pointer-events:none!important}
.pm{background:var(--panel);border:1px solid var(--pborder);border-radius:8px;padding:3px 8px;font-size:11.5px;min-width:150px}
.pm b{font-size:12px}.pm small{color:var(--muted)}
.pm .ph{height:5px;background:#0b0f18;border-radius:3px;overflow:hidden;margin-top:2px}
.pm .ph i{display:block;height:100%;background:linear-gradient(90deg,#ff7b7b,#d22f35)}
.pstat{background:#0f1520;border:1px solid #2c3a55;border-radius:8px;padding:8px 10px;margin:8px 0;font-weight:700}
.plist{display:flex;flex-direction:column;gap:4px}
.prow{background:#141d2d;border:1px solid #2c3a55;border-radius:8px;padding:6px 10px}
.prow small{color:var(--muted)}
#partyBody{min-width:300px;max-width:560px}
body.touch #rightCol{top:56px;right:8px}
body.touch #questLog{min-width:150px;max-width:200px;font-size:11.5px;padding:4px 8px}
body.touch .gf{font-size:11.5px}
body.touch #partyHud{top:58px;left:156px;flex-direction:row;flex-wrap:wrap;max-width:46vw}

<script>
'use strict';
/* =====================================================================
   JAKTMARKEN – MapleStory-inspirerat 2D-spel (grundversion)
   ===================================================================== */

/* ---------- KONFIG: Supabase (molnsparning) ----------
   Fyll i din projekt-URL och din anon/publishable key.
   Lämnas de tomma kan de anges i spelet (⚙ på startskärmen),
   annars sparas allt bara lokalt i webbläsaren. */
const SUPABASE_URL   = 'https://ihordfvmtouxfsmmboca.supabase.co';
const SUPABASE_KEY   = 'sb_publishable_cv4-17tzpJjegFh8aQSYUA_cyTaoNh5';
const SUPABASE_TABLE = 'jaktmarken_accounts';

/* =====================================================================
   HJÄLPFUNKTIONER
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(a + Math.random()*(b-a+1));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const easeOut = t => 1-(1-t)*(1-t);
const pick = a => a[Math.floor(Math.random()*a.length)];
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt1 = v => { const r = Math.round(v*10)/10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const fmtExp = v => { const r = Math.round(v*100)/100; return Number.isInteger(r) ? String(r) : String(r); };
const fmtSv = v => (Math.round(v*100)/100).toLocaleString('sv-SE',{maximumFractionDigits:2});
function seeded(s){ return () => { s = (s*16807) % 2147483647; return (s-1)/2147483646; }; }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); }
function ell(c,x,y,rx,ry,rot=0){ c.beginPath(); c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2); c.fill(); }
function line(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }

/* =====================================================================
   DATA: RARITIES, FÖREMÅL, KLASSER, TALANGER, MONSTER
   ===================================================================== */
const RARITIES = [
  {id:'common',    name:'Common',    color:'#b9bec7', chance:63, flat:0, pct:0,  sell:0},
  {id:'uncommon',  name:'Uncommon',  color:'#4fdc5b', chance:20, flat:1, pct:10, sell:20},
  {id:'rare',      name:'Rare',      color:'#4c95ff', chance:10, flat:2, pct:15, sell:40},
  {id:'epic',      name:'Epic',      color:'#b86bff', chance:5,  flat:3, pct:20, sell:60},
  {id:'legendary', name:'Legendary', color:'#ff9d2b', chance:2,  flat:4, pct:25, sell:100},
];
const RAR = Object.fromEntries(RARITIES.map(r=>[r.id,r]));
function rollRarity(boost){
  let r=Math.random()*100;
  if(boost){   // silvermonster: aldrig Common, 3x chans till Rare/Epic/Legendary, resten Uncommon
    if(r<6) return 'legendary'; r-=6; if(r<15) return 'epic'; r-=15; if(r<30) return 'rare'; return 'uncommon';
  }
  for(const x of RARITIES){ if(r<x.chance) return x.id; r-=x.chance; } return 'common';
}

const STATS = ['str','int','agi'];
const STATN = {str:'Str', int:'Int', agi:'Agi'};

const EQ_SLOTS = [['hjalm','Hjälm'],['halsband','Halsband'],['axel','Axelskydd'],['mantel','Mantel'],['brost','Bröstpansar'],['handskar','Handskar'],['balte','Bälte'],['byxor','Byxor'],['skor','Skor'],['ring1','Ring'],['ring2','Ring'],['vapen','Vapen']];
const SLOTN = Object.fromEntries(EQ_SLOTS); SLOTN.ring = 'Ring';

// Gear: [slot, namn level 2, namn level 5]
const GEAR = [
  ['hjalm','Lappad mössa','Ekbarkshjälm'], ['halsband','Snäckhalsband','Bärnstenshalsband'],
  ['axel','Läderaxlar','Ekaxlar'], ['mantel','Säckvävsmantel','Mossmantel'],
  ['brost','Linnetunika','Nitläderpansar'], ['handskar','Arbetshandskar','Jägarhandskar'],
  ['balte','Repbälte','Spännbälte'], ['byxor','Lappade byxor','Ridbyxor'],
  ['skor','Träskor','Vandrarkängor'], ['ring','Kopparring','Silverring'],
];
const BASES = {};
for(const [slot,n2,n5] of GEAR){
  BASES[slot+'2'] = {id:slot+'2', slot, name:n2, req:2, armor:1, smin:0, smax:1};
  BASES[slot+'5'] = {id:slot+'5', slot, name:n5, req:5, armor:3, smin:1, smax:2};
}
const WTYPE = {yxa:'Yxa', bage:'Pilbåge', stav:'Stav', pinne:'Pinne'};
for(const [id,wtype,name,req,atk] of [
  ['pinne1','pinne','Träpinne',1,[1,1]],   // startvapen för alla klasser – endast närstrid
  ['yxa2','yxa','Vedyxa',2,[2,3]],     ['yxa5','yxa','Skogsyxa',5,[4,6]],
  ['bage2','bage','Kvistbåge',2,[1,2]],['bage5','bage','Almbåge',5,[2,4]],
  ['stav2','stav','Pinnstav',2,[1,2]], ['stav5','stav','Viskstav',5,[2,4]],
]) BASES[id] = {id, slot:'vapen', wtype, name, req, atk};

/* Förbrukningsvaror (köps i butiken, staplas upp till 20 per plats i väskan) */
const STACK_MAX = 20, SCROLL_SLOTS = 6, SCROLL_CHANCE = 0.6;
const CONS = {
  hpPot: {kind:'pot',    name:'HP-dryck',    price:10, hp:50, desc:'Återställer 50 HP.'},
  mpPot: {kind:'pot',    name:'Mana-dryck',  price:10, mp:50, desc:'Återställer 50 mana.'},
  scrStr:{kind:'scroll', name:'Scroll: Str +1',        price:20, target:'gear',   stat:'str', amt:1, desc:'Utrustning (ej vapen): 60% chans till +1 Str.'},
  scrInt:{kind:'scroll', name:'Scroll: Int +1',        price:20, target:'gear',   stat:'int', amt:1, desc:'Utrustning (ej vapen): 60% chans till +1 Int.'},
  scrAgi:{kind:'scroll', name:'Scroll: Agi +1',        price:20, target:'gear',   stat:'agi', amt:1, desc:'Utrustning (ej vapen): 60% chans till +1 Agi.'},
  scrAtk:{kind:'scroll', name:'Scroll: Vapenskada +2', price:20, target:'weapon', stat:'atk', amt:2, desc:'Vapen: 60% chans till +2 attack.'},
};
const isCons = it => !!(it && CONS[it.base]);
const itemName = it => isCons(it) ? CONS[it.base].name : it.name + (it.plus ? ` (+${it.plus})` : '');

function makeItem(baseId, rarity='common'){
  const b = BASES[baseId], r = RAR[rarity];
  const it = {uid:uid(), base:b.id, name:b.name, slot:b.slot, req:b.req, rarity};
  const up = v => Math.ceil(v*(100+r.pct)/100);   // procentbonus, avrundat uppåt
  if(b.slot==='vapen'){
    it.wtype = b.wtype;
    it.atkMin = up(b.atk[0]+r.flat);
    it.atkMax = up(b.atk[1]+r.flat);
  } else {
    it.armor = b.armor;
    for(const s of STATS){ const v = randInt(b.smin,b.smax); it[s] = v>0 ? up(v) : 0; }
  }
  return it;
}
const sellPrice = it => isCons(it) ? 0 : Math.round(5*it.req*(100+RAR[it.rarity].sell)/100);

const CLASSES = {
  skog:{id:'skog', name:'Skogshuggare', main:'str', mainMult:1.2, wtype:'yxa', starter:'pinne1', aspd:0, trees:['smash','skog_b','skog_c'],
    desc:'Närstrid med yxa. Slår alltid med sitt vapen, vilket vapen han än håller. Varje Styrka (Str) ger +1,2 attack.'},
  hippie:{id:'hippie', name:'Hippie', main:'agi', mainMult:1, wtype:'bage', starter:'pinne1', aspd:0, trees:['hippie','hippie_b','hippie_c'],
    desc:'Skjuter pilar när hon har en pilbåge – inga pilar behövs. Smidighet (Agi) ger extra attack. Börjar med en träpinne (närstrid).'},
  viskare:{id:'viskare', name:'Viskare', main:'int', mainMult:1, wtype:'stav', starter:'pinne1', aspd:0.2, trees:['schh','visk_b','visk_c'],
    desc:'Kastar målsökande viskningar med stav (1 mana per stavens level). Intellekt (Int) ger extra attack. +20% attackhastighet. Börjar med en träpinne (närstrid).'},
};

/* Talangträd. v = värde per rank (1/2/3). active = förmåga som kan läggas på 1–9. */
const TREES = {
  smash:{name:'Smash', talents:[
    {id:'blodslag', tier:1, max:3, icon:'🩸', name:'Blodsslag', v:[1,2,3], d:v=>`När du slår spenderas ${v}% av ditt max-HP. Det förlorade HP:t läggs på som extra skada.`},
    {id:'segved', tier:1, max:3, icon:'🌳', name:'Seg ved', v:[1,2,3], d:v=>`+${v} HP-regenerering per sekund.`},
    {id:'snabbafotter', tier:2, max:3, icon:'👢', name:'Snabba fötter', v:[10,20,30], d:v=>`+${v}% rörelsehastighet.`},
    {id:'klyv', tier:2, max:3, icon:'🪓', name:'Klyv', active:true, v:[2,3,4], d:v=>`Förmåga: ett brett slag som träffar upp till ${v} fiender för 80% attackskada. Kostar 2 mana, ingen nedkylning.`},
  ]},
  hippie:{name:'Hippie-ki-yay', talents:[
    {id:'synfalt', tier:1, max:3, icon:'🎯', name:'Örnöga', v:[10,20,30], d:v=>`+${v}% attackräckvidd.`},
    {id:'studs', tier:1, max:3, icon:'🏹', name:'Studsande pilar', v:[1,2,3], d:v=>`Pilar har 30% chans att studsa vidare till ${v} ${v>1?'andra fiender':'annan fiende'} för 30% skada.`},
    {id:'blomster', tier:2, max:3, icon:'🌸', name:'Flower power', active:true, v:[10,20,30], d:v=>`Förmåga: +50% attackhastighet i ${v} sekunder. Nedkylning 30 s, kostar 10 mana.`},
    {id:'himla', tier:2, max:3, icon:'🚀', name:'Fredsraketen', active:true, v:[50,80,100], d:v=>`Förmåga: skjuter pilar runt dig som skadar alla närliggande fiender för ${v}% attackskada, och du flyger uppåt – högt nog för att nå nästa plattform. Nedkylning 20 s, kostar 10 mana.`},
  ]},
  schh:{name:'Schh', talents:[
    {id:'snabbvisk', tier:1, max:3, icon:'💨', name:'Snabba viskningar', v:[5,10,15], d:v=>`+${v}% attackhastighet.`},
    {id:'inrelugn', tier:1, max:3, icon:'💧', name:'Inre lugn', v:[1,2,3], d:v=>`+${v} mana-regenerering per sekund.`},
    {id:'eldboll', tier:2, max:3, icon:'🔥', name:'Eldboll', active:true, v:[1,5,10], d:(v,r)=>`Förmåga: en eldboll som exploderar för attackskada + ${v}. Kostar ${[5,10,20][r-1]} mana, nedkylning 5 s.`},
    {id:'glod', tier:2, max:3, icon:'♨️', name:'Glödande ord', v:[30,60,90], d:v=>`Efter en attack börjar fienden brinna för ${v}% av attackskadan under 5 sekunder.`},
  ]},
  // Kontoträdet delas av alla gubbar på kontot
  konto:{name:'Konto', account:true, talents:[
    {id:'k_exp',   tier:1, max:3, icon:'📚', name:'Vishet',        v:[5,10,15], d:v=>`+${v}% EXP från monster.`},
    {id:'k_atk',   tier:1, max:3, icon:'⚔️', name:'Slagkraft',     v:[2,4,6],   d:v=>`+${v} attack.`},
    {id:'k_stats', tier:1, max:3, icon:'💪', name:'Allround',      v:[1,2,3],   d:v=>`+${v} Str, Int och Agi.`},
    {id:'k_move',  tier:2, max:3, icon:'🏃', name:'Lätta steg',    v:[2,4,6],   d:v=>`+${v}% rörelsehastighet.`},
    {id:'k_drop',  tier:2, max:3, icon:'🍀', name:'Skattjägare',   v:[2,4,6],   d:v=>`+${v}% större chans att vapen och utrustning droppar.`},
    {id:'k_aspd',  tier:2, max:3, icon:'⚡', name:'Snabba händer', v:[2,4,6],   d:v=>`+${v}% attackhastighet.`},
    {id:'k_cdr',   tier:3, max:3, icon:'⏳', name:'Tålamod',       v:[5,10,15], d:v=>`${v}% kortare nedkylning på förmågor.`},
  ]},
};
for(const k of ['skog_b','skog_c','hippie_b','hippie_c','visk_b','visk_c']) TREES[k] = {name:k.endsWith('_b')?'Träd 2':'Träd 3', locked:true, talents:[]};
const TAL = {};
for(const [tk,t] of Object.entries(TREES)) for(const x of t.talents){ x.tree = tk; TAL[x.id] = x; }

const ABIL = {
  attack:   {name:'Basattack', icon:'⚔️'},
  klyv:     {cost:()=>2,  cd:()=>0,  atk:true},
  blomster: {cost:()=>10, cd:()=>30},
  himla:    {cost:()=>10, cd:()=>20, atk:true, rope:true},
  eldboll:  {cost:r=>[5,10,20][r-1], cd:()=>5, atk:true},
};
const abilName = id => id==='attack' ? 'Basattack' : CONS[id] ? CONS[id].name : TAL[id].name;

  async load(id){
    const r = await fetch(`${this.url}/rest/v1/${SUPABASE_TABLE}?name=eq.${encodeURIComponent(id)}&select=data`, {headers:this.hdr()});
    if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));
    const j = await r.json(); return j.length ? j[0].data : null;
  },
  async save(id, data, keepalive=false){
    const r = await fetch(`${this.url}/rest/v1/${SUPABASE_TABLE}?on_conflict=name`, {method:'POST', keepalive,
      headers:{...this.hdr(), Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({name:id, data, updated_at:new Date().toISOString()})});
    if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));
  },
};

function fixAccount(a){
  a.talents = a.talents||{}; a.chars = a.chars||[];
  for(const k of Object.keys(a.talents)) if(!TAL[k]) delete a.talents[k];
  const OLD_STARTERS=['yxa1','bage1','stav1'];
  const known = it => it && (BASES[it.base] || CONS[it.base]);
  for(const c of a.chars){
    c.talents=c.talents||{}; c.eq=c.eq||{}; c.hotbar=c.hotbar||Array(9).fill(null); while(c.hotbar.length<9) c.hotbar.push(null);
    c.gold=c.gold||0; c.exp=c.exp||0; c.level=c.level||1; c.kills=c.kills||{}; c.map=MAPS[c.map]?c.map:1; c.quests=c.quests||{};
    c.inv=(c.inv||[]).filter(Boolean).map(it=>OLD_STARTERS.includes(it.base)?makeItem('pinne1'):it).filter(known);
    for(const k in c.eq){ if(c.eq[k] && OLD_STARTERS.includes(c.eq[k].base)) c.eq[k]=makeItem('pinne1'); if(c.eq[k] && !known(c.eq[k])) c.eq[k]=null; }
    c.hotbar=c.hotbar.map(x=>(x && (x==='attack'||TAL[x]||CONS[x]))?x:null);
  }
  return a;
}

function rank(id){ const t=TAL[id]; if(!t) return 0; return (t.tree==='konto' ? (G.acct&&G.acct.talents[id]) : (G.ch&&G.ch.talents[id])) || 0; }

function charSpent(ch){ return Object.values(ch.talents).reduce((a,b)=>a+b,0); }
function charAvail(){ return (G.ch.level-1) - charSpent(G.ch); }
function acctPoints(a){ const best={}; for(const c of a.chars) best[c.cls]=Math.max(best[c.cls]||0, c.level); return Object.values(best).reduce((s,l)=>s+Math.floor(l/5),0); }
function acctAvail(){ return acctPoints(G.acct) - Object.values(G.acct.talents).reduce((a,b)=>a+b,0); }

function calcStats(ch){
  const C = CLASSES[ch.cls], L = ch.level-1;
  const bb = bookStatBonus(ch), ka = tv('k_stats');
  const s = {str:5+L+bb+ka, int:5+L+bb+ka, agi:5+L+bb+ka, armor:0, book:bb};
  for(const k in ch.eq){ const it=ch.eq[k]; if(!it) continue; s.armor+=it.armor||0; for(const st of STATS) s[st]+=it[st]||0; }
  s.maxHp = 50 + s.str*10;
  s.maxMp = 20 + s.int*10;
  s.hpReg = s.str*0.1 + tv('segved');
  s.mpReg = s.int*0.1 + tv('inrelugn');
  s.aspd = 1 + s.agi*0.01 + C.aspd + tv('snabbvisk')/100 + tv('k_aspd')/100 + (G.p && G.p.buffT>0 ? 0.5 : 0);
  s.move = 1 + tv('snabbafotter')/100 + tv('k_move')/100;
  s.range = 1 + tv('synfalt')/100;
  const w = ch.eq.vapen;
  s.wMin = w ? w.atkMin : 1; s.wMax = w ? w.atkMax : 1;
  s.statAtk = s[C.main]*(C.mainMult||1) + tv('k_atk');
  s.atkMin = s.wMin + s.statAtk; s.atkMax = s.wMax + s.statAtk;
  s.mode = (ch.cls==='hippie' && w && w.wtype==='bage') ? 'bow' : (ch.cls==='viskare' && w && w.wtype==='stav') ? 'whisper' : 'melee';
  s.manaCost = s.mode==='whisper' ? w.req : 0;
  return s;
}
function recalc(){
  if(!G.ch) return;
  G.stats = calcStats(G.ch);
  G.ch.hp = Math.min(G.ch.hp, G.stats.maxHp); G.ch.mp = Math.min(G.ch.mp, G.stats.maxMp);
  if(typeof Net!=='undefined') Net.lookDirty = true;
}

const keys = {}; let jumpEdge=false, upEdge=false;
const isTyping = e => e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA');
window.addEventListener('keydown', e=>{
  if(isTyping(e)) return;
  if(G.mode!=='game') return;
  const c = e.code;
  if(e.ctrlKey || e.metaKey || c.startsWith('Control')) e.preventDefault();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','AltLeft','AltRight'].includes(c)) e.preventDefault();
  const dm = c.match(/^(?:Digit|Numpad)([1-9])$/);
  if(dm && G.assigning){ assignSlot(+dm[1]-1, G.assigning); return; }
  if(!keys[c]){ if(c==='Space') jumpEdge=true; if(c==='KeyW'||c==='ArrowUp') upEdge=true; }
  keys[c] = true;
  if(!e.repeat){
    if(c==='KeyI'||c==='KeyC') toggleWin('bag');
    else if(c==='KeyT'||c==='KeyK') toggleWin('tal');
    else if(c==='KeyB') toggleWin('shop');
    else if(c==='KeyM') toggleWin('book');
    else if(c==='KeyP') toggleWin('party');
    else if(c==='KeyQ') toggleWin('quest');
    else if(c==='Escape') escPressed();
  }
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

function input(){
  const I = {
    left:  !!(keys.ArrowLeft||keys.KeyA) || Touch.jx < -0.35,
    right: !!(keys.ArrowRight||keys.KeyD) || Touch.jx > 0.35,
    up:    !!(keys.ArrowUp||keys.KeyW) || Touch.jy < -0.5,
    down:  !!(keys.ArrowDown||keys.KeyS) || Touch.jy > 0.55,
    jump:  !!keys.Space || Touch.jump,
    jumpEdge: jumpEdge || Touch.jumpEdge,
    upEdge: upEdge,
    touchUpEdge: Touch.jy < -0.5 && !Touch.wasUp,
    attack: !!(keys.ControlLeft||keys.ControlRight) || Touch.atk,
    hot: [1,2,3,4,5,6,7,8,9].map(i=>!!(keys['Digit'+i]||keys['Numpad'+i])),

    let dx=e.clientX-Touch.bx, dy=e.clientY-Touch.by; const d=Math.hypot(dx,dy), m=50;
    if(d>m){ dx=dx/d*m; dy=dy/d*m; }
    Touch.jx=dx/m; Touch.jy=dy/m; knob.style.transform=`translate(${dx}px,${dy}px)`;
  });
  const end = e=>{
    if(e.pointerId!==Touch.id) return;
    const moved = Math.hypot(e.clientX-Touch.bx, e.clientY-Touch.by);
    if(moved<12 && performance.now()-Touch.t0<300) tapPick(e.clientX, e.clientY);
    Touch.id=null; Touch.jx=Touch.jy=0; knob.style.transform=''; base.classList.remove('on');
  };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
})();
function holdBtn(el, on, off){
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); el.classList.add('down'); try{el.setPointerCapture(e.pointerId);}catch(_){} on(); });
  const f = ()=>{ el.classList.remove('down'); off(); };

holdBtn($('#tJump'), ()=>{ Touch.jump=true; Touch.jumpEdge=true; }, ()=>Touch.jump=false);

// Mus: håll pekaren över föremål för att plocka upp
cv.addEventListener('pointermove', e=>{ if(e.pointerType==='mouse'){ G.mouse.x=e.clientX; G.mouse.y=e.clientY; G.mouse.in=true; } });

function screenToWorld(x,y){ return {x:G.cam.x + x/G.zoom, y:G.cam.y + y/G.zoom}; }
function tapPick(sx,sy,r=44){
  if(G.mode!=='game' || !G.p || G.p.dead) return;
  const w = screenToWorld(sx,sy); let best=null, bd=r/G.zoom+6;
  for(const o of curMap().portals){ if(Math.abs(w.x-o.x)<45 && w.y>o.y-110 && w.y<o.y+10){ if(portalNear(G.p)) { G.portalTap=true; return; } else throttleMsg('portal','Gå fram till portalen först.','#cfe0ff'); } }
  for(const d of G.drops){ if(d.picking) continue; const dd=Math.hypot(d.x-w.x, d.y-14-w.y); if(dd<bd){ bd=dd; best=d; } }
  if(best) tryPick(best);
}

   SPELARE OCH FYSIK

function makePlayer(x,y){
  const st=curMap().start; x=x??st.x; y=y??st.y;
  return {x, y, vx:0, vy:0, w:28, h:58, face:1, onGround:true, plat:platAt(x,y)||platById.g1, climb:null, ropeCd:0,
    drop:null, dropT:0, atkCd:0, atkAnim:0, atkDur:.3, atkMode:'swing', walkT:0, climbT:0, inv:1.5, knockT:0, cds:{}, buffT:0, dead:false, potCd:0, portalCd:0.6};
}
const portalNear = p => p.onGround && !p.climb ? curMap().portals.find(o=>Math.abs(p.x-o.x)<32 && Math.abs(p.y-o.y)<4) : null;
const platAt = (x,y) => PLATS.find(p=>Math.abs(p.y-y)<2 && x>=p.x1-1 && x<=p.x2+1) || null;
const ropeNear = p => ROPES.find(r=>Math.abs(p.x-r.x)<14 && p.y>=r.top-4 && p.y<=r.bottom+4) || null;

function updatePlayer(dt){
  const p=G.p, s=G.stats, ch=G.ch;
  if(p.dead) return;
  ch.hp = Math.min(s.maxHp, ch.hp + s.hpReg*dt);
  ch.mp = Math.min(s.maxMp, ch.mp + s.mpReg*dt);
  p.atkCd=Math.max(0,p.atkCd-dt); p.atkAnim=Math.max(0,p.atkAnim-dt); p.inv=Math.max(0,p.inv-dt);
  p.knockT=Math.max(0,p.knockT-dt); p.ropeCd=Math.max(0,p.ropeCd-dt); p.dropT=Math.max(0,p.dropT-dt); if(p.dropT<=0) p.drop=null;
  p.potCd=Math.max(0,p.potCd-dt); p.portalCd=Math.max(0,p.portalCd-dt);
  for(const k in p.cds) p.cds[k]=Math.max(0,p.cds[k]-dt);
  if(p.buffT>0){ p.buffT-=dt; if(Math.random()<dt*14) fxPetal(p); if(p.buffT<=0){ p.buffT=0; recalc(); log('🌸 Flower power tog slut.','#ffb3de'); } }
  const I = input();

  // Klättring
  if(p.climb){
    const r=p.climb; p.x=r.x; p.vx=0;
    const dy = I.up ? -1 : I.down ? 1 : 0;
    p.vy = dy*PHY.climb; p.y += p.vy*dt; if(dy) p.climbT+=dt;
    if(p.y<=r.top){ p.y=r.top; p.climb=null; p.plat=platAt(p.x,r.top); p.onGround=!!p.plat; p.vy=0; p.ropeCd=0.25; }
    else if(p.y>=r.bottom){ p.y=r.bottom; p.climb=null; p.plat=platAt(p.x,r.bottom); p.onGround=!!p.plat; p.vy=0; p.ropeCd=0.25; }
    else if(I.jumpEdge && (I.left||I.right)){ p.climb=null; p.face=I.left?-1:1; p.vx=p.face*190; p.vy=-330; p.onGround=false; p.ropeCd=0.35; }
    useInputs(I);
    return;
  }

  // Horisontell rörelse
  const spd = PHY.walk*s.move;
  let dir = (I.right?1:0)-(I.left?1:0);
  if(p.knockT>0) dir=0;
  const attacking = p.atkAnim>0 && p.onGround;
  if(attacking) dir=0;
  if(dir && !attacking) p.face=dir;
  if(p.onGround){ if(p.knockT<=0) p.vx = dir*spd; }
  else if(dir){ p.vx += (dir*spd - p.vx)*Math.min(1, dt*3); }
  if(p.onGround && Math.abs(p.vx)>1) p.walkT+=dt*s.move;

  // Ta tag i rep
  const rope = ropeNear(p);
  if(rope && p.ropeCd<=0 && p.knockT<=0){
    if(I.up && p.y>rope.top+3 && p.y<=rope.bottom+3){ p.climb=rope; p.x=rope.x; p.vx=p.vy=0; p.onGround=false; return; }
    if(I.down && p.onGround && Math.abs(p.y-rope.top)<3){ p.climb=rope; p.x=rope.x; p.y=rope.top+6; p.vx=p.vy=0; p.onGround=false; return; }
  }

  // Portal: tryck upp (W/↑ eller styrspak uppåt) när du står i den
  const portal = portalNear(p);
  if(portal && p.portalCd<=0 && (I.upEdge || I.touchUpEdge || G.portalTap)){
    G.portalTap=false;
    if(isGuestNet()) throttleMsg('ptl','Bara party-ledaren kan byta karta – du följer med automatiskt.','#cfe0ff');
    else { changeMap(portal.to, portal.toX, portal.toY); return; }
  }
  G.portalTap=false;

  // Hopp (mellanslag, eller W/upp när inget rep finns) – nedåt + hopp = släpp genom plattform
  const wantJump = I.jump || I.jumpEdge || (I.upEdge && !rope && !portal);
  if(wantJump && p.onGround && p.knockT<=0){
    if(I.down && p.plat && !p.plat.solid){ p.drop=p.plat; p.dropT=0.3; p.onGround=false; p.vy=60; }
    else if(!I.down){ p.vy=-PHY.jump; p.onGround=false; }
  }

  if(!p.onGround) p.vy = Math.min(PHY.maxFall, p.vy + PHY.g*dt);

  // X-led + väggar (gropens kanter)
  const ox=p.x; p.x += p.vx*dt;
  const hw=p.w/2;
  for(const w of WALLS){
    if(p.y > w.top+1 && p.y-p.h < w.bottom){ if(ox < w.x) p.x = Math.min(p.x, w.x-hw); else p.x = Math.max(p.x, w.x+hw); }
  }
  p.x = clamp(p.x, hw, WORLD.w-hw);

  // Y-led + landning på plattformar (envägs, som i MapleStory)
  const oy=p.y; p.y += p.vy*dt;
  if(!p.onGround){
    if(p.vy>=0){
      let land=null;
      for(const pl of PLATS){ if(pl===p.drop) continue; if(p.x>=pl.x1 && p.x<=pl.x2 && oy<=pl.y+0.5 && p.y>=pl.y){ if(!land || pl.y<land.y) land=pl; } }
      if(land){ p.y=land.y; p.vy=0; p.onGround=true; p.plat=land; if(p.knockT>0) p.vx*=0.3; }
    }
  } else if(!p.plat || p.x<p.plat.x1 || p.x>p.plat.x2){ p.onGround=false; p.vy=0; }
  if(p.y > WORLD.h){ const st=curMap().start; p.x=st.x; p.y=st.y; p.vy=0; p.onGround=true; p.plat=platAt(st.x,st.y); }

  useInputs(I);
}
function useInputs(I){
  if(I.attack) useAbility('attack');
  for(let i=0;i<9;i++) if(I.hot[i] && G.ch.hotbar[i]) useAbility(G.ch.hotbar[i]);
  for(const id in Touch.skills) if(Touch.skills[id]) useAbility(id);
}

function checkContact(){
  const p=G.p; if(p.inv>0 || p.dead) return;
  for(const m of G.monsters){
    if(m.dead || m.spawnT>0.15) continue;
    const mw = m.d.w*0.38;
    if(Math.abs(m.x-p.x) < mw+p.w/2-4 && p.y > m.y-m.d.h+6 && p.y-p.h < m.y-2){ hurtPlayer(m.d.touch, Math.sign(p.x-m.x)||-m.dir); break; }
  }
}
function hurtPlayer(dmg, dir){
  const p=G.p, s=G.stats;
  const real = dmg*100/(100+s.armor);   // armor minskar skadan
  G.ch.hp -= real; p.inv=1.2;
  addNum(p.x, p.y-p.h-6, real, 'hurt');
  if(!p.climb){ p.vx=dir*230; p.vy=-260; p.onGround=false; p.knockT=0.35; }
  if(G.ch.hp<=0.05){ G.ch.hp=0; die(); }
}
function die(){
  const p=G.p; p.dead=true; p.climb=null; Touch.reset();
  $('#deathBox').classList.remove('hidden');
  markDirty();
}
function respawn(){
  const keepCds = G.p.cds;
  G.p = makePlayer(); G.p.cds = keepCds; recalc();
  G.ch.hp = G.stats.maxHp; G.ch.mp = G.stats.maxMp;
  $('#deathBox').classList.add('hidden'); snapCam();
}
$('#btnRespawn').addEventListener('click', respawn);

function inFrontMonsters(range, maxN){
  const p=G.p, res=[];
  for(const m of G.monsters){
    if(m.dead || m.spawnT>0 || m.pend) continue;
    const dx=(m.x-p.x)*p.face;
    if(dx<-20 || dx>range+m.d.w/2) continue;
    if(m.y-m.d.h > p.y+10 || m.y < p.y-p.h-10) continue;
    res.push([Math.abs(dx),m]);
  }
  res.sort((a,b)=>a[0]-b[0]);
  return res.slice(0,maxN).map(a=>a[1]);
}
function rangedTarget(range, down=72, up=72){
  const p=G.p; let best=null, bd=1e9; const py=p.y-30;
  for(const m of G.monsters){
    if(m.dead || m.spawnT>0 || m.pend) continue;
    const dx=(m.x-p.x)*p.face; if(dx<-10 || dx>range) continue;
    const dy=(m.y-m.d.h/2)-py; if(dy>down || dy<-up) continue;
    if(dx<bd){ bd=dx; best=m; }
  }
  return best;
}
function nearestMonster(x,y,maxR,exclude){
  let best=null, bd=maxR;
  for(const m of G.monsters){ if(m.dead || m.spawnT>0 || m.pend || (exclude&&exclude.has(m))) continue; const d=Math.hypot(m.x-x,(m.y-m.d.h/2)-y); if(d<bd){ bd=d; best=m; } }
  return best;
}
// Viskaren siktar bara framåt och når inte lika högt upp (WHISPER_UP)
const WHISPER_UP = 165;
function whisperOk(m, ox, oy, face){
  if(m.dead || m.spawnT>0 || m.pend) return false;
  const dx=m.x-ox, dy=(m.y-m.d.h/2)-oy;
  return dx*face >= -12 && dy >= -WHISPER_UP && Math.hypot(dx,dy) <= WHISPER_RANGE;
}
function whisperTarget(){
  const p=G.p, ox=p.x, oy=p.y-34; let best=null, bd=1e9;
  for(const m of G.monsters){ if(!whisperOk(m,ox,oy,p.face)) continue; const d=Math.hypot(m.x-ox,(m.y-m.d.h/2)-oy); if(d<bd){ bd=d; best=m; } }
  return best;
}
function startAtkAnim(mode){
  const p=G.p; p.atkCd=atkInterval(); p.atkDur=Math.min(0.32, p.atkCd*0.95); p.atkAnim=p.atkDur; p.atkMode=mode;
}
function meleeStrike(mult, maxN, range){
  const p=G.p, s=G.stats;
  const targets = inFrontMonsters(range, maxN);
  let bonus = 0;
  const bl = tv('blodslag');
  if(bl && targets.length){ const cost=Math.ceil(s.maxHp*bl/100); if(G.ch.hp>cost+1){ G.ch.hp-=cost; bonus=cost; } }
  for(const m of targets) hitMonster(m, Math.max(1,Math.round(rollAtk()*mult))+bonus, {dir:p.face});
  G.fx.push({type:'slash', x:p.x+p.face*18, y:p.y-32, dir:p.face, t:0, dur:.22, r:range*0.62, wide:maxN>1});
  return targets.length;
}
function basicAttack(){
  const p=G.p, s=G.stats;
  if(s.mode==='bow'){
    startAtkAnim('shoot');
    const range = BOW_RANGE*s.range, t = rangedTarget(range, 115, 72);   // hippie når lite längre nedåt
    G.projs.push({type:'arrow', x:p.x+p.face*18, y:p.y-33, vx:p.face*900, vy:0, speed:900, homing:1, target:t, dmg:rollAtk(), dist:0, maxDist:t?99999:range, life:1.6, hit:new Set(), canBounce:true, chain:0});
    netShot(G.projs[G.projs.length-1]);
  } else if(s.mode==='whisper' && G.ch.mp>=s.manaCost){
    G.ch.mp -= s.manaCost; startAtkAnim('cast');
    const t = whisperTarget();
    G.projs.push({type:'whisper', x:p.x+p.face*22, y:p.y-44, vx:p.face*320, vy:-20, speed:470, homing:0.9, target:t, seek:150, face:p.face, ox:p.x, oy:p.y-34, dmg:rollAtk(), dist:0, maxDist:WHISPER_RANGE+60, life:1.6, hit:new Set()});
    netShot(G.projs[G.projs.length-1]);
  } else {
    if(s.mode==='whisper') throttleMsg('mana','Inte tillräckligt med mana – du slår med staven.','#9cc6ff');
    startAtkAnim('swing'); meleeStrike(1,1,MELEE_RANGE);
  }
  return true;
}
const ABIL_USE = {
  klyv(r){ startAtkAnim('swing'); meleeStrike(0.8, TAL.klyv.v[r-1], 125); },
  blomster(r){ const p=G.p; p.buffT=TAL.blomster.v[r-1]; recalc(); for(let i=0;i<18;i++) fxPetal(p,true); log('🌸 Flower power! +50% attackhastighet.','#ffb3de'); },
  himla(r){
    const p=G.p, v=TAL.himla.v[r-1]; startAtkAnim('shoot');
    for(const m of G.monsters){ if(m.dead||m.spawnT>0) continue; if(Math.hypot(m.x-p.x,(m.y-m.d.h/2)-(p.y-30))<235) hitMonster(m, Math.max(1,Math.round(rollAtk()*v/100)), {dir:Math.sign(m.x-p.x)||1}); }
    if(p.climb){ p.climb=null; p.ropeCd=0.4; }
    p.vy=-860; p.onGround=false; p.drop=null; p.knockT=0;
    G.fx.push({type:'radial', x:p.x, y:p.y-30, t:0, dur:.4}); netFx('radial', p.x, p.y-30);
    for(let i=0;i<20;i++) particle(p.x, p.y, pick(['#ffd93d','#ff8fd0','#9ef0a0']), rand(-120,120), rand(20,160), .6, 3, 300);
  },
  eldboll(r){
    const p=G.p; startAtkAnim('cast');
    const t = rangedTarget(440) || whisperTarget();
    G.projs.push({type:'fire', x:p.x+p.face*24, y:p.y-44, vx:p.face*540, vy:0, speed:540, homing:0.6, target:t, dmg:rollAtk()+TAL.eldboll.v[r-1], dist:0, maxDist:460, life:1.4, hit:new Set()});
    netShot(G.projs[G.projs.length-1]);
  },
};
function useAbility(id){
  const p=G.p; if(!p || p.dead || G.mode!=='game') return false;
  if(id==='attack'){ if(p.atkCd>0 || p.climb) return false; return basicAttack(); }
  if(CONS[id]) return usePot(id);
  const a=ABIL[id], r=rank(id); if(!a || !r) return false;
  if(p.climb && !a.rope) return false;
  if((p.cds[id]||0)>0) return false;
  if(a.atk && p.atkCd>0) return false;
  const cost=a.cost(r);
  if(G.ch.mp<cost){ throttleMsg('mana2','Inte tillräckligt med mana!','#9cc6ff'); return false; }
  const cd=a.cd(r)*(1-tv('k_cdr')/100);
  G.ch.mp-=cost; p.cds[id]=cd; p.cdMax=p.cdMax||{}; p.cdMax[id]=cd;
  ABIL_USE[id](r);
  return true;
}

/* ---------- Drycker & staplar ---------- */
const consCount = base => G.ch ? G.ch.inv.reduce((s,it)=>s+(it.base===base?it.count:0),0) : 0;
function stackRoom(base){ const ch=G.ch; let r=0; for(const it of ch.inv) if(it.base===base) r+=STACK_MAX-it.count; return r+(INV_MAX-ch.inv.length)*STACK_MAX; }
function addStack(base, n){
  const ch=G.ch; let left=n;
  for(const it of ch.inv){ if(!left) break; if(it.base===base && it.count<STACK_MAX){ const a=Math.min(STACK_MAX-it.count,left); it.count+=a; left-=a; } }
  while(left>0 && ch.inv.length<INV_MAX){ const a=Math.min(STACK_MAX,left); ch.inv.push({uid:uid(), base, count:a}); left-=a; }
  return n-left;
}
function takeOne(base){
  const ch=G.ch; for(let i=ch.inv.length-1;i>=0;i--){ const it=ch.inv[i]; if(it.base===base){ it.count--; if(it.count<=0) ch.inv.splice(i,1); return true; } }
  return false;
}
function usePot(base){
  const p=G.p, c=CONS[base], s=G.stats, ch=G.ch;
  if(!p || p.dead || c.kind!=='pot' || p.potCd>0) return false;
  if(!consCount(base)){ throttleMsg('no'+base,`Du har inga ${c.name.toLowerCase()}r. Köp i butiken (B).`,'#ff9b9b'); return false; }
  if(c.hp && ch.hp>=s.maxHp-0.01){ throttleMsg('hpfull','HP är redan fullt.','#cfe0ff'); return false; }
  if(c.mp && ch.mp>=s.maxMp-0.01){ throttleMsg('mpfull','Manan är redan full.','#cfe0ff'); return false; }
  takeOne(base); p.potCd=0.5;
  if(c.hp){ ch.hp=Math.min(s.maxHp,ch.hp+c.hp); G.fx.push({type:'text',x:p.x,y:p.y-p.h-20,text:`+${c.hp} HP`,color:'#7dff8a',t:0,dur:1,size:13}); }
  if(c.mp){ ch.mp=Math.min(s.maxMp,ch.mp+c.mp); G.fx.push({type:'text',x:p.x,y:p.y-p.h-20,text:`+${c.mp} MP`,color:'#8fc2ff',t:0,dur:1,size:13}); }
  for(let i=0;i<8;i++) particle(p.x+rand(-12,12),p.y-rand(10,50),c.hp?'#ff8a8a':'#8fc2ff',rand(-20,20),rand(-90,-30),.6,3,0);
  markDirty(); refreshOpen(); return true;
}

/* ---------- Byta karta via portal ---------- */
function changeMap(to, x, y){
  if(!MAPS[to]) return;
  G.mapId=to; G.ch.map=to;
  const keep={cds:G.p.cds, cdMax:G.p.cdMax, buffT:G.p.buffT};
  G.p=makePlayer(x,y); Object.assign(G.p,keep); G.p.portalCd=0.8;
  initSpawns(); G.drops=[]; G.projs=[]; G.nums=[]; G.fx=[];
  $('#mapName').textContent=curMap().name; snapCam();
  for(let i=0;i<24;i++) particle(G.p.x+rand(-20,20),G.p.y-rand(0,70),pick(['#8fd0ff','#c9a2ff','#fff']),rand(-60,60),rand(-120,20),.7,3,0);
  toast(`🌀 <b>${curMap().name}</b>`); log(`Du gick till <b>${curMap().name}</b>.`,'#ffe9a8');
  if(isHostNet()){ netToGuests({t:'map', to, x:Math.round(G.p.x), y:G.p.y}); Net.monT=0; }
  hostUpdatePresence();
  markDirty(true);
}

function hitMonster(m, dmg, o={}){
  if(m.dead || m.pend) return;
  const by = o.by || Net.myId;
  if(isGuestNet()){
    // Gäst: visa direkt, låt värden avgöra (värden äger monstren)
    m.hp -= dmg; m.showHp=4; m.predT=G.time+0.7;
    if(!o.noKb){ m.hurtT=0.4; m.dir=-(o.dir||1); }
    addNum(m.x, m.y-m.d.h-6, dmg, o.kind||'dmg', m);
    sparks(m.x, m.y-m.d.h/2, '#fff3b0', 6);
    let burn=null; if(!o.noBurn && G.ch.cls==='viskare'){ const v=tv('glod'); if(v) burn={per:dmg*v/100/5, left:5}; }
    netToHost({t:'hit', id:m.id, d:Math.round(dmg*100)/100, dir:o.dir||0, k:o.kind||'', nk:o.noKb?1:0, b:burn});
    if(m.hp<=0.001) m.pend=true;
    return;
  }
  m.hp -= dmg; m.showHp = 4; m.lastBy = by;
  if(!o.noKb){ m.kb=(o.dir||Math.sign(m.x-G.p.x)||1)*70; m.kbT=0.15; m.hurtT=0.45; m.dir=-(o.dir||1); }
  addNum(m.x, m.y-m.d.h-6, dmg, o.kind||'dmg', m);
  sparks(m.x, m.y-m.d.h/2, o.kind==='burn' ? '#ff9a3a' : '#fff3b0', o.kind==='burn'?2:6);
  if(o.burn) m.burn={left:o.burn.left||5, tick:1, per:o.burn.per, by};
  else if(!o.noBurn && by===Net.myId && G.ch && G.ch.cls==='viskare'){ const v=tv('glod'); if(v) m.burn={left:5, tick:1, per:dmg*v/100/5, by}; }
  if(isHostNet()) netToGuests({t:'dmg', id:m.id, v:Math.round(dmg*100)/100, k:o.kind||'', by});
  if(m.hp<=0.001) killMonster(m);
}
function killMonster(m){
  m.dead=true; m.dieT=0.6; m.burn=null; if(m.sp){ m.sp.monster=null; m.sp.deadAt=G.time; }
  const d=m.d, killer=m.lastBy||Net.myId, party=isHostNet();
  if(party) netToGuests({t:'kill', id:m.id});
  // EXP: ensam 100 %. I party: den som dödar får 75 %, övriga 30 % var (+5 % party-bonus på allt)
  const ids = party ? netMemberIds() : [Net.myId];
  for(const id of ids){
    const share = ids.length>1 ? (id===killer?0.75:0.30) : 1;
    const mult = m.rare ? 3 : 1;
    if(id===Net.myId) gainKillExp(m.type, share, ids.length>1, id===killer, mult);
    else netTo(id, {t:'exp', ty:m.type, s:share, kill:id===killer?1:0, x:mult});
  }
  spawnDrop(m, {kind:'gold', amount:d.gold});
  const db = killer===Net.myId ? tv('k_drop') : ((G.others[killer]&&G.others[killer].db)||0);
  if(m.rare || Math.random() < d.drop*(1+db/100)) spawnDrop(m, {kind:'item', item:makeItem(pick(d.pool), rollRarity(m.rare)), owner:killer});
}
function gainKillExp(type, share, party, isKill, mult=1){
  const ch=G.ch, d=MOBS[type]; ch.kills=ch.kills||{};
  if(isKill){
    const before=bookLvl(ch.kills[type]||0), statBefore=bookStatBonus(ch);
    ch.kills[type]=(ch.kills[type]||0)+1;
    const lv=bookLvl(ch.kills[type]);
    if(lv>before){
      log(`📖 Monsterbok: <b>${d.name}</b> nivå ${lv}! +${lv*5}% EXP från ${d.name}. (+1 monsterbokspoäng, totalt ${bookPoints(ch)})`,'#9fe0ff');
      toast(`📖 <b>${d.name}</b> – monsterbok nivå ${lv}`);
      if(bookStatBonus(ch)>statBefore){ recalc(); log(`📖 Monsterbokbonus: nu +${bookStatBonus(ch)} på alla basstats!`,'#9fe0ff'); }
      markDirty(true);
    }
  }
  const lv=bookLvl(ch.kills[type]||0);
  questKill(type);
  const base=d.exp*mult*(1+lv*0.05)*(1+tv('k_exp')/100)*share;
  const bonus=party?base*0.05:0;
  gainExp(base+bonus, party, bonus, party && !isKill);
  if(isOpen('book')) renderBook();
}
function gainExp(n, party, bonus, fromParty){
  const ch=G.ch; ch.exp += n;
  feed(`+${fmtSv(n)} EXP${fromParty?' från partyt':''}${party?` (+${fmtSv(bonus)} party-bonus)`:''}`, party?'party':'');
  let up=false;
  while(ch.exp >= expReq(ch.level)){ ch.exp -= expReq(ch.level); ch.level++; up=true; }
  if(up) onLevelUp();
  markDirty();
}
function addGold(a, party){
  const ch=G.ch; ch.goldFrac=(ch.goldFrac||0)+a;
  const w=Math.floor(ch.goldFrac+1e-9); ch.gold+=w; ch.goldFrac-=w;
  feed(`+${fmtSv(a)} guld${party?' (delat i partyt)':''}`, 'gold');
  markDirty();
}
function feed(text, cls){
  const box=$('#gainFeed'), d=document.createElement('div'); d.className='gf '+(cls||''); d.textContent=text;
  box.appendChild(d); while(box.children.length>7) box.firstChild.remove();
  setTimeout(()=>d.classList.add('fade'),3200); setTimeout(()=>d.remove(),4100);
}
function onLevelUp(){
  const ch=G.ch; recalc(); ch.hp=G.stats.maxHp; ch.mp=G.stats.maxMp;
  const p=G.p; G.fx.push({type:'beam', x:p.x, y:p.y, t:0, dur:1.6}); netFx('beam', p.x, p.y); hostUpdatePresence();
  for(let i=0;i<30;i++) particle(p.x+rand(-20,20), p.y-rand(0,60), pick(['#ffe066','#fff','#ffb341']), rand(-60,60), rand(-260,-80), 1.1, 3, 120);
  log(`⭐ Level ${ch.level}! +1 Str, Int och Agi samt +1 talangpoäng.`, '#ffe066');
  if(ch.level%5===0) log('🌍 Du fick ett kontopoäng till det gemensamma kontoträdet!', '#9fe0ff');
  toast(`<b style="font-size:20px;color:#ffe066">LEVEL UP!</b><br>Du är nu level ${ch.level}`);
  if(QUEST_ORDER.some(id=>QUESTS[id].lvl===ch.level && !(ch.quests||{})[id])){ log('❗ Nytt uppdrag tillgängligt – se uppdragsloggen uppe till höger.','#ffe066'); }
  updateTalDot(); refreshOpen(); markDirty(true);
}

/* =====================================================================
   MONSTER & SPAWNPOINTS
   ===================================================================== */
function initSpawns(){
  G.spawns=[]; G.monsters=[]; G.monById={};
  for(const [type,pid,xs] of curMap().spawns) for(const x of xs) G.spawns.push({type, plat:platById[pid], x, monster:null, deadAt:-99});
  for(const sp of G.spawns) spawnMonster(sp, true);
  G.spawnTimer=0;
}
function spawnMonster(sp, instant){
  const rare=Math.random()<RARE_CHANCE, d=mobDef(sp.type, rare);
  if(rare && G.mode==='game') log(`✦ En <b style="color:#e8eef6">${d.name}</b> har dykt upp!`,'#cfd8e6');
  const m={type:sp.type, d, sp, plat:sp.plat, x:sp.x, y:sp.plat.y, hp:d.hp, maxHp:d.hp, dir:Math.random()<.5?-1:1, state:'idle', timer:rand(.3,2),
    t:rand(0,10), rot:0, kb:0, kbT:0, hurtT:0, showHp:0, dead:false, dieT:0, spawnT:instant?0:0.5, burn:null, stack:0, stackT:-9, id:++G.monSeq, rare};
  sp.monster=m; G.monsters.push(m); G.monById[m.id]=m;
}
function spawnTick(dt){
  if(isGuestNet()) return;
  G.spawnTimer += dt;
  if(G.spawnTimer >= RESPAWN_EVERY){
    G.spawnTimer -= RESPAWN_EVERY;
    for(const sp of G.spawns) if(!sp.monster && G.time-sp.deadAt >= RESPAWN_MIN_DEAD && Math.random() < RESPAWN_CHANCE) spawnMonster(sp);
  }
}
function updateMonsters(dt){
  if(isGuestNet()) return updateMonstersNet(dt);
  for(let i=G.monsters.length-1;i>=0;i--){
    const m=G.monsters[i]; m.t+=dt;
    if(m.dead){ m.dieT-=dt; if(m.dieT<=0){ G.monsters.splice(i,1); delete G.monById[m.id]; } continue; }
    if(m.spawnT>0) m.spawnT=Math.max(0,m.spawnT-dt);
    if(m.showHp>0) m.showHp-=dt;
    if(m.burn){
      m.burn.tick-=dt;
      if(m.burn.tick<=0){ m.burn.tick+=1; m.burn.left--; const b=m.burn; if(b.left<=0) m.burn=null; hitMonster(m, b.per, {noBurn:true, noKb:true, kind:'burn', by:b.by}); if(m.dead) continue; }
      if(m.burn && Math.random()<dt*10) particle(m.x+rand(-10,10), m.y-rand(5,m.d.h), pick(['#ff9a3a','#ffd23f']), rand(-10,10), rand(-60,-20), .5, 2.5, -40);
    }
    const ox=m.x;
    if(m.kbT>0){ m.kbT-=dt; m.x+=m.kb*dt; }
    else if(m.hurtT>0){ m.hurtT-=dt; }
    else {
      m.timer-=dt;
      if(m.timer<=0){ if(Math.random()<0.6){ m.state='walk'; m.dir=Math.random()<.5?-1:1; m.timer=rand(1.2,3.5); } else { m.state='idle'; m.timer=rand(.8,2.4); } }
      if(m.state==='walk') m.x += m.dir*m.d.speed*dt;
    }
    const mg=m.d.w/2+2;
    if(m.x<m.plat.x1+mg){ m.x=m.plat.x1+mg; if(m.state==='walk') m.dir=1; }
    if(m.x>m.plat.x2-mg){ m.x=m.plat.x2-mg; if(m.state==='walk') m.dir=-1; }
    if(m.type==='mossa') m.rot += (m.x-ox)/(m.rare?42:21);
    if(m.rare && Math.random()<dt*5) particle(m.x+rand(-m.d.w/2,m.d.w/2), m.y-rand(0,m.d.h), pick(['#ffffff','#dfe7f2','#b8c4d4']), rand(-10,10), rand(-50,-15), .7, 2.5, 0);
  }
}

/* =====================================================================
   PROJEKTILER
   ===================================================================== */
function updateMonstersNet(dt){
  for(let i=G.monsters.length-1;i>=0;i--){
    const m=G.monsters[i]; m.t+=dt;
    if(m.dead){ m.dieT-=dt; if(m.dieT<=0){ G.monsters.splice(i,1); delete G.monById[m.id]; } continue; }
    if(m.spawnT>0) m.spawnT=Math.max(0,m.spawnT-dt);
    if(m.showHp>0) m.showHp-=dt;
    if(m.hurtT>0) m.hurtT-=dt;
    const ox=m.x; m.x += (m.tx-m.x)*Math.min(1,dt*10);
    if(m.type==='mossa') m.rot += (m.x-ox)/(m.rare?42:21);
    if(m.rare && Math.random()<dt*5) particle(m.x+rand(-m.d.w/2,m.d.w/2), m.y-rand(0,m.d.h), pick(['#ffffff','#dfe7f2','#b8c4d4']), rand(-10,10), rand(-50,-15), .7, 2.5, 0);
    if(m.burning && Math.random()<dt*10) particle(m.x+rand(-10,10), m.y-rand(5,m.d.h), pick(['#ff9a3a','#ffd23f']), rand(-10,10), rand(-60,-20), .5, 2.5, -40);
  }
}
function updateProjs(dt){
  for(let i=G.projs.length-1;i>=0;i--){
    const pr=G.projs[i]; pr.t=(pr.t||0)+dt; pr.life-=dt;
    let tg=pr.target; if(tg && tg.dead) tg=pr.target=null;
    if(!tg && pr.seek && !pr.cos && pr.t>0.05){
      let best=null, bd=pr.seek;
      for(const m of G.monsters){ if(pr.hit.has(m) || !whisperOk(m,pr.ox,pr.oy,pr.face)) continue; const d=Math.hypot(m.x-pr.x,(m.y-m.d.h/2)-pr.y); if(d<bd){ bd=d; best=m; } }
      tg=pr.target=best;
    }
    if(tg){
      const dx=tg.x-pr.x, dy=(tg.y-tg.d.h/2)-pr.y, d=Math.hypot(dx,dy)||1;
      if(pr.homing>=1){ pr.vx=dx/d*pr.speed; pr.vy=dy/d*pr.speed; }
      else { const k=Math.min(1,dt*pr.homing*10); pr.vx+=(dx/d*pr.speed-pr.vx)*k; pr.vy+=(dy/d*pr.speed-pr.vy)*k; }
    }
    const step=Math.hypot(pr.vx,pr.vy)*dt; pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.dist+=step;
    if(pr.type==='whisper' && Math.random()<.7) particle(pr.x,pr.y,pick(['#c9a2ff','#8f6bff','#e8dcff']),rand(-20,20),rand(-20,20),.45,2.5,0);
    if(pr.type==='fire' && Math.random()<.9) particle(pr.x,pr.y,pick(['#ff7a1a','#ffd23f','#ff4a1a']),rand(-30,30),rand(-50,10),.4,3.5,-60);
    let hitM=null;
    if(tg){ if(Math.hypot(tg.x-pr.x,(tg.y-tg.d.h/2)-pr.y) < Math.max(16,tg.d.w*.45)) hitM=tg; }
    else for(const m of G.monsters){ if(m.dead||m.spawnT>0||pr.hit.has(m)) continue; if(Math.abs(m.x-pr.x)<m.d.w/2 && pr.y>m.y-m.d.h && pr.y<m.y){ hitM=m; break; } }
    if(hitM){ projHit(pr,hitM); G.projs.splice(i,1); continue; }
    if(pr.life<=0 || pr.dist>=pr.maxDist){ if(pr.type==='fire') explode(pr); G.projs.splice(i,1); }
  }
}
function projHit(pr, m){
  const dir=Math.sign(pr.vx)||1;
  if(pr.cos){ if(pr.type==='fire') explode(pr); else sparks(m.x, m.y-m.d.h/2, pr.type==='whisper'?'#c9a2ff':'#fff3b0', 4); return; }
  if(pr.type==='fire'){ explode(pr); return; }
  hitMonster(m, pr.dmg, {dir});
  pr.hit.add(m);
  if(pr.type==='whisper'){ for(let i=0;i<8;i++) particle(m.x,m.y-m.d.h/2,pick(['#c9a2ff','#fff']),rand(-90,90),rand(-90,90),.4,2.5,0); return; }
  if(pr.type==='arrow'){
    if(pr.canBounce){ const r=tv('studs'); if(r && Math.random()<0.3) bounceArrow(m, r, Math.max(1,Math.round(pr.dmg*0.3)), pr.hit); }
    else if(pr.chain>0) bounceArrow(m, pr.chain, pr.dmg, pr.hit);
  }
}
function bounceArrow(from, count, dmg, hitSet){
  if(count<=0) return;
  const t = nearestMonster(from.x, from.y-from.d.h/2, 270, hitSet);
  if(!t) return;
  G.projs.push({type:'arrow', bounce:true, x:from.x, y:from.y-from.d.h/2, vx:0, vy:0, speed:760, homing:1, target:t, dmg, dist:0, maxDist:99999, life:1.2, hit:hitSet, canBounce:false, chain:count-1});
}
function explode(pr){
  G.fx.push({type:'ring', x:pr.x, y:pr.y, t:0, dur:.35, r:85});
  for(let i=0;i<22;i++) particle(pr.x,pr.y,pick(['#ff7a1a','#ffd23f','#ff4a1a','#fff1b0']),rand(-220,220),rand(-220,120),.55,4,200);
  if(pr.cos) return;
  for(const m of G.monsters){ if(m.dead||m.spawnT>0) continue; if(Math.hypot(m.x-pr.x,(m.y-m.d.h/2)-pr.y)<85+m.d.w/3) hitMonster(m, pr.dmg, {dir:Math.sign(m.x-pr.x)||1}); }
}

/* =====================================================================
   DROPS (guld och föremål)
   ===================================================================== */
function spawnDrop(m, data, tossDir){
  const n = G.drops.filter(d=>G.time-d.born<0.05).length;
  const vx = tossDir ? tossDir*rand(150,190) : (n%2?1:-1)*rand(20,60)+(n>1?rand(-30,30):0);
  const d={...data, id:data.id||('d'+(++G.dropSeq)+'_'+Net.myId.slice(0,4)), x:m.x, y:m.y-m.d.h/2, vx, vy:tossDir?-300:-380, plat:m.plat, landed:false, born:G.time, life:120, t:rand(0,6), picking:false, pickT:0,
    owner:data.owner||null, ownerT:data.owner?G.time+60:0, blockBy:data.block||null, blockT:data.block?G.time+3:0};
  G.drops.push(d);
  if(isHostNet()) netToGuests({t:'drop', d:dropMsg(d)});
  return d;
}
const canPick = (d, who) => !(d.kind==='item' && d.owner && d.owner!==who && G.time<d.ownerT);
const blockedFor = (d, who) => d.blockBy===who && G.time<d.blockT;   // den som släppte något kan inte råka plocka upp det direkt igen
function canFit(item){ return isCons(item) ? stackRoom(item.base)>=item.count : G.ch.inv.length+Net.pendingItems<INV_MAX; }
function dropFromBag(u){
  const ch=G.ch, p=G.p, i=ch.inv.findIndex(x=>x.uid===u); if(i<0 || !p || p.dead) return;
  if(!p.onGround || !p.plat){ throttleMsg('dropair','Du måste stå på marken för att släppa saker.','#ff9b9b'); return; }
  const it=ch.inv[i]; ch.inv.splice(i,1); G.ui.sel=null; G.ui.trash=null;
  if(isGuestNet()) netToHost({t:'dropItem', item:it, x:Math.round(p.x), plat:p.plat.id, f:p.face});
  else spawnDrop({x:p.x, y:p.plat.y, d:{h:40}, plat:p.plat}, {kind:'item', item:it, block:Net.myId}, p.face);
  log(`⬇ Du släppte ${isCons(it)?it.count+' × ':''}${esc(itemName(it))} på marken.`,'#cfe0ff');
  markDirty(); refreshOpen(); buildHotbar();
}
const nameOf = id => id===Net.myId ? (G.ch?G.ch.name:'du') : ((G.others[id]&&G.others[id].name)||'en annan spelare');
const ownerName = id => id===Net.myId ? 'dig' : nameOf(id);
function tryPick(d){
  if(d.picking || G.time-d.born<0.3 || (d.reqT||0)>G.time || blockedFor(d, Net.myId)) return;
  if(d.kind==='item' && !canFit(d.item)){ throttleMsg('full','Väskan är full! Sälj något i butiken.','#ff9b9b'); return; }
  if(!canPick(d, Net.myId)){ throttleMsg('own','Föremålet tillhör '+esc(ownerName(d.owner))+' i '+Math.ceil(d.ownerT-G.time)+' s till.','#ff9b9b'); return; }
  if(isGuestNet()){
    d.reqT=G.time+1;
    if(d.kind==='item'){ Net.pendingItems++; setTimeout(()=>{ Net.pendingItems=Math.max(0,Net.pendingItems-1); },1500); }
    netToHost({t:'pick', id:d.id}); return;
  }
  d.picking=true; d.pickT=0; d.by=Net.myId;
  if(isHostNet()) netToGuests({t:'gone', id:d.id, by:Net.myId});
}
function updateDrops(dt){
  const p=G.p;
  let mw=null; if(G.mouse.in && !G.touch && G.mode==='game') mw=screenToWorld(G.mouse.x,G.mouse.y);
  for(let i=G.drops.length-1;i>=0;i--){
    const d=G.drops[i]; d.t+=dt;
    if(d.picking){
      d.pickT+=dt;
      const tgt = d.by===Net.myId ? p : G.others[d.by];
      if(tgt){ d.x=lerp(d.x,tgt.x,Math.min(1,dt*14)); d.y=lerp(d.y,tgt.y-30,Math.min(1,dt*14)); }
      if(d.pickT>0.22){ if(!d.applied && d.by===Net.myId) applyPick(d); G.drops.splice(i,1); }
      continue;
    }
    if(!d.landed){
      d.vy+=1900*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.x=clamp(d.x,d.plat.x1+10,d.plat.x2-10);
      if(d.vy>0 && d.y>=d.plat.y){ d.y=d.plat.y; d.landed=true; }
    }
    d.life-=dt;
    if(d.life<=0 && !isGuestNet()){ G.drops.splice(i,1); if(isHostNet()) netToGuests({t:'gone', id:d.id, by:null}); continue; }
    if(p && !p.dead && G.mode==='game' && G.time-d.born>0.35){
      if(Math.abs(d.x-p.x)<26 && Math.abs(d.y-p.y)<44) tryPick(d);
      else if(mw && Math.hypot(d.x-mw.x, d.y-14-mw.y)<24) tryPick(d);
    }
  }
}
function applyPick(d){
  if(d.kind==='gold'){ if(isHostNet()) splitGold(d.amount); else addGold(d.amount,false); }
  else receiveItem(d.item, d);
  markDirty();
}
function receiveItem(item, d){
  const ch=G.ch;
  if(isCons(item) && stackRoom(item.base)>=item.count){
    addStack(item.base, item.count);
    log(`Du plockade upp ${item.count} × <b>${esc(itemName(item))}</b>`, '#e9eef7');
    refreshOpen(); buildHotbar(); markDirty(); return;
  }
  if(isCons(item) || ch.inv.length>=INV_MAX){
    throttleMsg('full','Väskan är full!','#ff9b9b');
    if(isGuestNet()) netToHost({t:'redrop', item, x:Math.round(G.p.x), plat:(G.p.plat||platById.g1).id});
    else spawnDrop({x:G.p.x, y:(G.p.plat||platById.g1).y, d:{h:20}, plat:G.p.plat||platById.g1}, {kind:'item', item, owner:Net.myId});
    return;
  }
  ch.inv.push(item);
  const r=RAR[item.rarity];
  log(`Du plockade upp <b style="color:${r.color}">${esc(itemName(item))}</b> (${r.name}, Lv ${item.req})`, '#e9eef7');
  refreshOpen(); markDirty();
}
function splitGold(amount){
  const ids=netMemberIds(), share=amount/ids.length, party=ids.length>1;
  for(const id of ids){ if(id===Net.myId) addGold(share, party); else netTo(id, {t:'gold', a:share}); }
}

/* =====================================================================
   EFFEKTER & SKADESIFFROR
   ===================================================================== */
function particle(x,y,c,vx,vy,life,s,g){ G.fx.push({type:'p',x,y,vx,vy,t:0,dur:life,c,s,g}); }
function sparks(x,y,c,n){ for(let i=0;i<n;i++) particle(x,y,c,rand(-140,140),rand(-160,40),.35,2.5,300); }
function fxPetal(p,burst){ G.fx.push({type:'petal', x:p.x+rand(-24,24), y:p.y-rand(0,60), vx:rand(-30,30)*(burst?3:1), vy:rand(-40,-10)*(burst?3:1), t:0, dur:1.1, rot:rand(0,6), c:pick(['#ff8fd0','#ffd1ec','#fff27a'])}); }
function addNum(x,y,v,kind,m){
  let off=0;
  if(m){ if(G.time-m.stackT<0.45) m.stack++; else m.stack=0; m.stackT=G.time; off=m.stack*20; }
  G.nums.push({x:x+rand(-4,4), y:y-off, v, kind, t:0});
}
function updateFx(dt){
  for(let i=G.fx.length-1;i>=0;i--){
    const f=G.fx[i]; f.t+=dt;
    if(f.type==='p'){ f.vy+=f.g*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; }
    if(f.type==='petal'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.rot+=dt*4; }

function camTarget(){
  const vw=VW/G.zoom, vh=VH/G.zoom; let tx, ty;
  if(G.mode==='game' && G.p){ tx=G.p.x-vw/2; ty=G.p.y-vh*0.64; }
  else { tx=(Math.sin(G.time*0.04)*0.5+0.5)*(WORLD.w-vw); ty=WORLD.h-vh-10; }
  tx = vw>=WORLD.w ? (WORLD.w-vw)/2 : clamp(tx,0,WORLD.w-vw);
  ty = clamp(ty, Math.min(0,WORLD.h-vh), WORLD.h-vh);
  return {x:tx,y:ty};
}

const ICONS = {};
function iconURL(it){
  const key=it.base+'|'+(it.rarity||'common');
  if(!ICONS[key]){ const cc=document.createElement('canvas'); cc.width=cc.height=64; drawIcon(cc.getContext('2d'),it.base,it.rarity,64); ICONS[key]=cc.toDataURL(); }
  return ICONS[key];
}

let hudT=0;
function updateHud(){
  const ch=G.ch, s=G.stats, p=G.p;
  $('#lvl').textContent=`Lv. ${ch.level}`;
  $('#hudName').textContent=ch.name; $('#hudCls').textContent=CLASSES[ch.cls].name;
  const hp=Math.max(0,ch.hp), mp=Math.max(0,ch.mp);
  $('#hpFill').style.width=(hp/s.maxHp*100)+'%'; $('#hpTxt').textContent=`HP ${hp>0&&hp<1?1:Math.floor(hp)} / ${s.maxHp}`;
  $('#mpFill').style.width=(mp/s.maxMp*100)+'%'; $('#mpTxt').textContent=`MP ${Math.floor(mp)} / ${s.maxMp}`;
  const req=expReq(ch.level);
  $('#expFill').style.width=(ch.exp/req*100)+'%'; $('#expTxt').textContent=`EXP ${Math.floor(ch.exp)} / ${req}  (${(ch.exp/req*100).toFixed(2)}%)`;
  $('#hudGold').textContent=ch.gold;
  $('#buffs').innerHTML = p.buffT>0 ? `<div class="buff">🌸 ${Math.ceil(p.buffT)} s</div>` : '';
  // snabbfält + touchknappar: nedkylning och mana
  for(const el of $$('#hotbar .hs')){
    const id=ch.hotbar[+el.dataset.i]; paintCd(el,id);
  }
  for(const el of $$('#tSkills .tbtn')) paintCd(el, el.dataset.sk);
  renderTouchPots();
  renderPartyHud();
  renderQuestLog();
  drawMinimap();
}
function paintCd(el,id){
  const cdEl=el.querySelector('.cd'), cdt=el.querySelector('.cdt');
  const cnt=el.querySelector('.cnt');
  if(!id){ cdEl.style.background=''; if(cdt) cdt.textContent=''; if(cnt) cnt.textContent=''; el.classList.remove('nomana'); return; }
  if(CONS[id]){ const n=consCount(id); cdEl.style.background=''; if(cdt) cdt.textContent=''; if(cnt) cnt.textContent=n; el.classList.toggle('nomana', n===0); return; }
  if(cnt) cnt.textContent='';
  const p=G.p; let rem=0, max=1;
  if(id!=='attack'){ rem=p.cds[id]||0; max=(p.cdMax&&p.cdMax[id])||ABIL[id].cd(rank(id)||1)||1; }
  cdEl.style.background = rem>0 ? `conic-gradient(rgba(0,0,0,.65) ${rem/max*360}deg, transparent 0)` : '';
  if(cdt) cdt.textContent = rem>0 ? Math.ceil(rem) : '';
  const cost = id==='attack' ? G.stats.manaCost : (rank(id)?ABIL[id].cost(rank(id)):0);
  el.classList.toggle('nomana', G.ch.mp < cost);
}
function buildHotbar(){
  const ch=G.ch;
  $('#hotbar').innerHTML = ch.hotbar.map((id,i)=>`<div class="hs ${G.assigning?'assign':''}" data-i="${i}" title="${id?esc(abilName(id)):'Tom plats'}"><span class="k">${i+1}</span><span class="ic">${id?abilIcon(id):''}</span><i class="cd"></i><span class="cdt"></span><span class="cnt"></span></div>`).join('');
}
$('#hotbar').addEventListener('click', e=>{
  const el=e.target.closest('.hs'); if(!el) return; const i=+el.dataset.i;
  if(G.assigning) assignSlot(i,G.assigning); else if(G.ch.hotbar[i]) useAbility(G.ch.hotbar[i]);
});
$('#hotbar').addEventListener('contextmenu', e=>{ const el=e.target.closest('.hs'); if(!el) return; e.preventDefault(); G.ch.hotbar[+el.dataset.i]=null; buildHotbar(); markDirty(); });
function assignSlot(i,id){
  const hb=G.ch.hotbar; for(let k=0;k<9;k++) if(hb[k]===id) hb[k]=null; hb[i]=id;
  G.assigning=null; $('#hint').classList.add('hidden'); buildHotbar(); refreshOpen(); markDirty();
  log(`${abilIcon(id)} ${abilName(id)} ligger nu på tangent ${i+1}.`,'#cfe0ff');
}
function startAssign(id){ G.assigning=id; buildHotbar(); const h=$('#hint'); h.innerHTML=`Tryck <span class="kbd">1</span>–<span class="kbd">9</span> eller klicka en ruta i snabbfältet för ${abilIcon(id)} ${esc(abilName(id))} · Esc avbryter`; h.classList.remove('hidden'); }

function drawMinimap(){

  mmc.strokeStyle='#d8b07a'; mmc.lineWidth=Math.max(1,DPR);
  for(const r of ROPES){ mmc.beginPath(); mmc.moveTo(r.x*sx,(r.top-y0)*sy); mmc.lineTo(r.x*sx,(r.bottom-y0)*sy); mmc.stroke(); }
  mmc.fillStyle='#b48cff'; for(const o of curMap().portals){ mmc.beginPath(); mmc.arc(o.x*sx,(o.y-14-y0)*sy,3*DPR,0,7); mmc.fill(); }
  mmc.fillStyle='#7fd0ff'; for(const o of Object.values(G.others)){ if(!o.seen||(o.map!==undefined&&o.map!==G.mapId)) continue; mmc.beginPath(); mmc.arc(o.x*sx,(o.y-12-y0)*sy,2.6*DPR,0,7); mmc.fill(); }
  if(G.p){ mmc.fillStyle='#ffe033'; mmc.strokeStyle='#000'; mmc.lineWidth=1; mmc.beginPath(); mmc.arc(G.p.x*sx,(G.p.y-12-y0)*sy,3*DPR,0,7); mmc.fill(); mmc.stroke(); }

}
function throttleMsg(key,text,color){ if((G.msgT[key]||0)>G.time) return; G.msgT[key]=G.time+2; log(text,color); }
function toast(html,ms=2600){

function itemStatsHtml(it){
  let h='';

function itemHtml(it, where){

  if(isCons(it)){

const tip=$('#tip');

document.addEventListener('pointermove',e=>{

function findItem(u){
  const ch=G.ch; const i=ch.inv.find(x=>x.uid===u); if(i) return {it:i,where:'inv'};

/* ---------- Karaktär & väska ---------- */
function renderBag(){
  const ch=G.ch, s=G.stats, C=CLASSES[ch.cls], sel=G.ui.sel;
  const sm=G.ui.scrollMode && ch.inv.find(x=>x.uid===G.ui.scrollMode);
  const smc = it => !sm ? '' : (it.uid===sm.uid ? 'sel' : scrollFits(sm,it) ? 'elig' : 'inelig');

  const m=C.main, row=(k,v,cls='')=>`<span class="${cls}">${k}</span><b class="${cls}">${v}</b>`;

    +row('HP-reg',fmt1(s.hpReg)+'/s')+row('Mana-reg',fmt1(s.mpReg)+'/s')+row('Attackhastighet',Math.round(s.aspd*100)+'%')+row('Rörelse',Math.round(s.move*100)+'%')
    +(ch.cls==='hippie'?row('Räckvidd',Math.round(s.range*100)+'%'):'')+row('Basattack',modeTxt)
    +(s.book?row('📖 Monsterbok',`+${s.book} alla stats`):'')
    +`<span class="full">★ = klassens huvudstat: varje poäng ger +1 attack (Skogshuggare +1,2).</span>`;
  $('#bagCount').textContent=`(${ch.inv.length}/${INV_MAX})`; $('#bagGold').textContent=ch.gold;
  let g='';

    if(!it){ g+=`<div class="slot blank"></div>`; continue; }

    g+=`<div class="slot ${cons?'r-cons':'r-'+it.rarity} ${sel===it.uid&&!sm?'sel':''} ${!cons&&ch.level<it.req?'cant':''} ${smc(it)}" data-uid="${it.uid}"><img src="${iconURL(it)}" alt="">${cons?`<span class="cnt">${it.count}</span>`:it.plus?`<span class="cnt plus">+${it.plus}</span>`:''}</div>`; }

function renderBagDetail(){

    else acts+=`<button class="btn sm green" data-act="scroll">Använd på föremål…</button>`;

  }

    acts+=`<button class="btn sm green" data-act="equip" ${G.ch.level<it.req?'disabled':''}>Utrusta</button>`;

    acts+=`<button class="btn sm" data-act="drop">⬇ Släpp på marken</button>`;
    acts+=`<button class="btn sm red" data-act="trash">${G.ui.trash===it.uid?'Säker? Tryck igen':'Släng'}</button>`;
