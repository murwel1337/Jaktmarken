$('#win-bag').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a && a.dataset.act==='cancelScroll'){ closeScrollMode(); return; }
  if(a){ const f=findItem(G.ui.sel); if(!f) return;
    if(a.dataset.act==='equip') equip(f.it.uid);
    else if(a.dataset.act==='unequip') unequip(f.slot);
    else if(a.dataset.act==='sell') sellItem(f.it.uid);
    else if(a.dataset.act==='trash'){ if(G.ui.trash===f.it.uid){ G.ch.inv=G.ch.inv.filter(x=>x.uid!==f.it.uid); G.ui.sel=null; G.ui.trash=null; log(`Du slängde ${esc(itemName(f.it))}.`,'#aab'); markDirty(); renderBag(); buildHotbar(); } else { G.ui.trash=f.it.uid; renderBagDetail(); } }
    else if(a.dataset.act==='use') usePot(f.it.base);
    else if(a.dataset.act==='drop') dropFromBag(f.it.uid);
    else if(a.dataset.act==='assign') startAssign(f.it.base);
    else if(a.dataset.act==='scroll'){ G.ui.scrollMode=f.it.uid; renderBag(); }
    return; }

  const el=e.target.closest('[data-uid]'); if(!el) return;
  if(G.ui.scrollMode){ if(el.dataset.uid===G.ui.scrollMode){ closeScrollMode(); return; } applyScroll(G.ui.scrollMode, el.dataset.uid); return; }
  G.ui.sel=el.dataset.uid; G.ui.trash=null;
  $$('#win-bag .slot.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); renderBagDetail();
});
$('#win-bag').addEventListener('dblclick',e=>{
  if(G.ui.scrollMode) return;
  const el=e.target.closest('[data-uid]'); if(!el) return; const f=findItem(el.dataset.uid); if(!f) return;
  if(isCons(f.it)){ if(CONS[f.it.base].kind==='pot') usePot(f.it.base); else { G.ui.scrollMode=f.it.uid; renderBag(); } return; }
  if(f.where==='inv') equip(f.it.uid); else unequip(f.slot);
});
function equip(u){
  const ch=G.ch, i=ch.inv.findIndex(x=>x.uid===u); if(i<0) return;
  const it=ch.inv[i]; if(isCons(it)) return;
  if(ch.level<it.req){ throttleMsg('req',`Du behöver level ${it.req} för ${esc(it.name)}.`,'#ff9b9b'); return; }
  let slot=it.slot; if(slot==='ring') slot = !ch.eq.ring1 ? 'ring1' : !ch.eq.ring2 ? 'ring2' : 'ring1';
  const old=ch.eq[slot]; ch.eq[slot]=it; ch.inv.splice(i,1); if(old) ch.inv.splice(i,0,old);
  G.ui.sel=it.uid; recalc(); markDirty(); refreshOpen();
}
function unequip(slot){
  const ch=G.ch; if(!ch.eq[slot]) return;
  if(ch.inv.length>=INV_MAX){ throttleMsg('full','Väskan är full!','#ff9b9b'); return; }
  ch.inv.push(ch.eq[slot]); ch.eq[slot]=null; recalc(); markDirty(); refreshOpen();
}
/* ---------- Enchanting scrolls ---------- */
function scrollFits(sc, it){
  if(!sc || !it || isCons(it)) return false;
  if((it.scrolls||0) >= SCROLL_SLOTS) return false;
  return CONS[sc.base].target==='weapon' ? it.slot==='vapen' : it.slot!=='vapen';
}
function applyScroll(su, iu){
  const ch=G.ch, sc=ch.inv.find(x=>x.uid===su), f=findItem(iu); if(!sc || !f) return;
  const it=f.it, c=CONS[sc.base];
  if(!scrollFits(sc,it)){
    throttleMsg('scr', isCons(it) ? 'Välj en utrustning eller ett vapen.' : (it.scrolls||0)>=SCROLL_SLOTS ? 'Föremålet har inga uppgraderingsplatser kvar.' : c.target==='weapon' ? 'Den här scrollen fungerar bara på vapen.' : 'Den här scrollen fungerar bara på utrustning (inte vapen).', '#ff9b9b');
    return;
  }
  sc.count--; if(sc.count<=0) ch.inv.splice(ch.inv.indexOf(sc),1);
  it.scrolls=(it.scrolls||0)+1;
  const left=SCROLL_SLOTS-it.scrolls, p=G.p;
  if(Math.random()<SCROLL_CHANCE){
    it.plus=(it.plus||0)+1;
    if(c.stat==='atk'){ it.atkMin+=c.amt; it.atkMax+=c.amt; } else it[c.stat]=(it[c.stat]||0)+c.amt;
    const what = c.stat==='atk' ? `+${c.amt} attack` : `+${c.amt} ${STATN[c.stat]}`;
    toast(`✨ <b style="color:#7dff8a">Lyckades!</b> ${esc(itemName(it))} fick ${what}. (${left} platser kvar)`);
    log(`✨ Scrollen lyckades: ${esc(itemName(it))} fick ${what}. ${left} uppgraderingsplatser kvar.`,'#7dff8a');
    if(p) for(let i=0;i<20;i++) particle(p.x+rand(-20,20),p.y-rand(0,60),pick(['#7dff8a','#ffe066','#fff']),rand(-80,80),rand(-160,-40),.8,3,60);
  } else {
    toast(`💥 <b style="color:#ff8a8a">Misslyckades.</b> Uppgraderingsplatsen förbrukades. (${left} kvar)`);
    log(`💥 Scrollen misslyckades på ${esc(itemName(it))}. ${left} uppgraderingsplatser kvar.`,'#ff9b9b');
  }
  G.ui.scrollMode=null; G.ui.sel=it.uid;
  if(f.where==='eq') recalc();
  markDirty(); refreshOpen();
}

function drawPortrait(cnv, cls, eq, sc){
  const c=cnv.getContext('2d'); c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cnv.width,cnv.height);
  c.translate(cnv.width/2-4, cnv.height-26); c.scale(sc,sc);
  c.fillStyle='rgba(0,0,0,.25)'; ell(c,0,0,16,4);
  drawChar(c,{cls, face:1, pose:'stand', t:0, walkT:0, eq});
}

/* ---------- Talanger ---------- */
function treeSpent(talents,tk){ return TREES[tk].talents.reduce((s,t)=>s+(talents[t.id]||0),0); }
const tierReq = tier => 3*(tier-1);   // T2 kräver 3 poäng i trädet, T3 kräver 6
function canLearn(t){
  const tree=TREES[t.tree], acc=!!tree.account, tl=acc?G.acct.talents:G.ch.talents, av=acc?acctAvail():charAvail();
  if(av<=0 || (tl[t.id]||0)>=t.max) return false;
  if(treeSpent(tl,t.tree) < tierReq(t.tier)) return false;
  return true;
}
function learn(id){
  const t=TAL[id]; if(!canLearn(t)) return;
  const acc=!!TREES[t.tree].account, tl=acc?G.acct.talents:G.ch.talents, before=tl[id]||0;
  tl[id]=before+1;
  if(t.active && before===0){ const hb=G.ch.hotbar; if(!hb.includes(id)){ const i=hb.indexOf(null); if(i>=0){ hb[i]=id; log(`${t.icon} ${t.name} lades på tangent ${i+1}.`,'#cfe0ff'); } } }
  recalc(); buildHotbar(); renderTouchSkills(); updateTalDot(); renderTal(); markDirty(true);
}
function resetTree(tk){
  const acc=!!TREES[tk].account, tl=acc?G.acct.talents:G.ch.talents;
  for(const t of TREES[tk].talents){ delete tl[t.id]; if(t.active){ G.ch.hotbar=G.ch.hotbar.map(x=>x===t.id?null:x); } }
  if(tk==='hippie') G.p.buffT=0;
  recalc(); buildHotbar(); renderTouchSkills(); updateTalDot(); renderTal(); markDirty(true);
}
function renderTal(){
  const ch=G.ch, C=CLASSES[ch.cls], tabs=[...C.trees,'konto'];
  if(!tabs.includes(G.ui.talTab)) G.ui.talTab=C.trees[0];
  const tk=G.ui.talTab, tree=TREES[tk];
  let h=`<div class="tabs">${tabs.map(k=>`<button class="tab ${k===tk?'on':''} ${TREES[k].locked?'lock':''}" data-tab="${k}">${TREES[k].locked?'🔒 ':''}${k==='konto'?'🌍 ':''}${TREES[k].name}</button>`).join('')}</div>`;
  if(tree.locked){ $('#talBody').innerHTML=h+`<div class="lockedtree">🔒 ${tree.name} för ${C.name} kommer i en senare uppdatering.</div>`; return; }
  const acc=!!tree.account, tl=acc?G.acct.talents:ch.talents, av=acc?acctAvail():charAvail(), spent=treeSpent(tl,tk);
  h+=`<div class="tinfo"><span>${acc?'Kontopoäng':'Talangpoäng'} kvar: <b>${av}</b></span><span>Spenderat i ${tree.name}: <b>${spent}</b></span></div>`;
  if(acc) h+=`<div class="shopinfo">Du får 1 kontopoäng per 5 levlar i varje klass (din högsta gubbe i varje klass räknas). Trädet delas av alla gubbar på kontot <b>${esc(G.acct.name)}</b>.</div>`;
  for(const tier of [...new Set(tree.talents.map(x=>x.tier))].sort()){
    const need=tierReq(tier), locked = spent<need;

function sellItem(u){
  const ch=G.ch, i=ch.inv.findIndex(x=>x.uid===u); if(i<0) return;
  const it=ch.inv[i]; if(isCons(it)) return;
  const pr=sellPrice(it); ch.inv.splice(i,1); ch.gold+=pr;
  if(G.ui.sel===u) G.ui.sel=null;
  log(`Sålde <b style="color:${RAR[it.rarity].color}">${esc(itemName(it))}</b> för ${pr} 🪙`,'#ffd25a'); markDirty(); refreshOpen();
}
function buy(id, n){
  const c=CONS[id], ch=G.ch;
  n=Math.min(n, Math.floor(ch.gold/c.price), stackRoom(id));
  if(n<=0){ throttleMsg('buy', ch.gold<c.price ? 'Du har inte råd.' : 'Väskan är full!', '#ff9b9b'); return; }
  const got=addStack(id,n); ch.gold-=got*c.price;
  log(`Köpte ${got} × ${c.name} för ${got*c.price} 🪙`,'#ffd25a');
  if(c.kind==='pot' && !ch.hotbar.includes(id)){
    let slot=id==='hpPot'?7:8; if(ch.hotbar[slot]) { slot=-1; for(let i=8;i>=0;i--) if(!ch.hotbar[i]){ slot=i; break; } }
    if(slot>=0){ ch.hotbar[slot]=id; if(!G.touch) log(`${c.name} ligger på tangent ${slot+1}.`,'#cfe0ff'); }
  }
  buildHotbar(); markDirty(); refreshOpen();
}

const QUESTS = {
  bar:{name:'Bärplockarens besvär', lvl:2, from:'Jägaren Berit',
    text:'Blåbären och mossabollarna har tagit över Jaktmarken I! Kan du tunna ut dem lite åt mig?',
    goals:{blabar:10, mossa:5}, exp:20, choose:['yxa2','bage2','stav2'], rarity:'uncommon'},
};
const QUEST_ORDER = ['bar'];
function questState(id){ const q=(G.ch.quests||{})[id]; return q ? q.state : (G.ch.level>=QUESTS[id].lvl ? 'offer' : 'locked'); }
function questGoalsDone(id){ const q=G.ch.quests[id]; return Object.entries(QUESTS[id].goals).every(([t,n])=>(q.prog[t]||0)>=n); }
function acceptQuest(id){
  G.ch.quests[id]={state:'active', prog:{}};
  log(`📜 Nytt uppdrag: <b>${QUESTS[id].name}</b>`,'#ffe066'); markDirty(true); renderQuest(); questLogKey=null;
}
function questKill(type){
  const ch=G.ch; if(!ch || !ch.quests) return;
  for(const id of QUEST_ORDER){
    const q=ch.quests[id], Q=QUESTS[id]; if(!q || q.state!=='active') continue;
    const need=Q.goals[type]; if(!need || (q.prog[type]||0)>=need) continue;
    q.prog[type]=(q.prog[type]||0)+1;
    if(questGoalsDone(id)){ q.state='complete'; toast(`✔ <b>${Q.name}</b> är klart!<br>Hämta belöningen i uppdragsloggen.`); log(`✔ Uppdraget <b>${Q.name}</b> är klart – tryck på uppdragsloggen för att hämta belöningen.`,'#7ee787'); }
    markDirty(); questLogKey=null; if(isOpen('quest')) renderQuest();
  }
}
function claimQuest(id, baseId){
  const Q=QUESTS[id], q=G.ch.quests[id]; if(!q || q.state!=='complete' || !Q.choose.includes(baseId)) return;
  if(G.ch.inv.length>=INV_MAX){ toast('Väskan är full – gör plats först.'); return; }
  const it=makeItem(baseId, Q.rarity); G.ch.inv.push(it); q.state='claimed';
  log(`🎁 Belöning för <b>${Q.name}</b>: <b style="color:${RAR[Q.rarity].color}">${esc(it.name)}</b> och ${Q.exp} EXP!`,'#7ee787');
  toast(`🎁 Du fick <b style="color:${RAR[Q.rarity].color}">${esc(it.name)}</b> och ${Q.exp} EXP!`);
  gainExp(Q.exp, false, 0, false);
  closeWin('quest'); questLogKey=null; refreshOpen(); markDirty(true);
}
let questLogKey=null;
function renderQuestLog(){
  const el=$('#questLog'), ch=G.ch; if(!ch) return;
  const rows=[];
  for(const id of QUEST_ORDER){
    const Q=QUESTS[id], st=questState(id), q=ch.quests[id];
    if(st==='offer') rows.push(`<div class="ql offer" data-q="${id}">❗ <b>Nytt uppdrag</b>${Q.name}</div>`);
    else if(st==='active') rows.push(`<div class="ql" data-q="${id}"><b>📜 ${Q.name}</b>${Object.entries(Q.goals).map(([t,n])=>{ const v=Math.min(n,q.prog[t]||0); return `<div class="qgoal ${v>=n?'ok':''}"><span>${MOBS[t].name}</span><span>${v}/${n}</span></div>`; }).join('')}</div>`);
    else if(st==='complete') rows.push(`<div class="ql done" data-q="${id}"><b>✔ ${Q.name}</b>Klart! Tryck för att hämta belöningen.</div>`);
  }
  const key=rows.join('');
  if(key===questLogKey) return; questLogKey=key;
  el.classList.toggle('hidden', !rows.length);
  el.innerHTML=rows.length?`<div class="qh">UPPDRAG</div>`+key:'';
}

async function toggleFS(){
  try{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      const el=document.documentElement;
      if(el.requestFullscreen) await el.requestFullscreen({navigationUI:'hide'}); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); else throw 0;
      if(navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(()=>{});
      if(G.touch && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
    } else { if(document.exitFullscreen) await document.exitFullscreen(); else if(document.webkitExitFullscreen) document.webkitExitFullscreen(); }
  }catch(_){ toast('Fullskärm stöds inte i den här webbläsaren.'); }
}

  let acct = (cloud&&local) ? ((local.savedAt||0)>(cloud.savedAt||0)?local:cloud) : (cloud||local);

/* =====================================================================
   MULTIPLAYER – P2P via WebRTC. Supabase Realtime används BARA för att
   hitta varandra (lobby) och för själva handskakningen. Allt spel går
   sedan direkt mellan spelarna, så Supabase-trafiken blir minimal.
   Värden (party-ledaren) äger monster, drops och EXP-fördelning.
   ===================================================================== */
const NET_VER = 1, PARTY_MAX = 4;
const TESTNET = /[?&]testnet=1/.test(location.search);   // endast för lokala tester
const rtcConf = () => ({iceServers: TESTNET ? [] : [{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});

const SigSupa = {
  client:null, lobby:null, lobbyReady:null, inbox:null, onMsg:null, onHosts:null, hosts:{},
  async sb(){
    if(this.client) return this.client;
    if(!Cloud.on) throw new Error('Supabase är inte inställt.');
    const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    this.client = mod.createClient(Cloud.url, Cloud.key, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
    return this.client;
  },
  sub(ch){ return new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('Ingen kontakt med Supabase Realtime.')),12000);
    ch.subscribe((st,err)=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); res(ch); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ clearTimeout(to); rej(new Error('Realtime: '+st+(err&&err.message?' – '+err.message:''))); } }); }); },
  async ensureLobby(){
    if(!this.lobbyReady) this.lobbyReady=(async()=>{
      const c=await this.sb(), ch=c.channel('jaktmarken-lobby',{config:{presence:{key:Net.myId}}});
      ch.on('presence',{event:'sync'},()=>{ const st=ch.presenceState(), hosts={}; for(const k in st){ const e=st[k]&&st[k][0]; if(e&&e.host&&k!==Net.myId) hosts[k]=e; } this.hosts=hosts; this.onHosts&&this.onHosts({...hosts}); });
      await this.sub(ch); this.lobby=ch; return ch;
    })();
    try{ return await this.lobbyReady; }catch(e){ this.lobbyReady=null; throw e; }
  },
  async ensureInbox(){
    if(this.inbox) return;
    const c=await this.sb(), ch=c.channel('jaktmarken-sig-'+Net.myId);
    ch.on('broadcast',{event:'sig'},({payload})=>this.onMsg&&this.onMsg(payload));
    await this.sub(ch); this.inbox=ch;
  },
  async send(to,payload){
    const c=await this.sb(), topic='jaktmarken-sig-'+to;
    let ch=c.getChannels().find(x=>x.topic==='realtime:'+topic);
    if(!ch){ ch=c.channel(topic); await this.sub(ch); }
    const r=await ch.send({type:'broadcast', event:'sig', payload:{...payload, to}});
    if(ch!==this.inbox) setTimeout(()=>{ if(c.getChannels().includes(ch)) c.removeChannel(ch); },3000);
    if(r!=='ok') throw new Error('Kunde inte skicka ('+r+')');
  },
  async host(info){ await this.ensureInbox(); const l=await this.ensureLobby(); await l.track(info); },
  async unhost(){ if(this.lobby) await this.lobby.untrack(); },
  async browse(cb){ this.onHosts=cb; await this.ensureLobby(); cb({...this.hosts}); },
  stopBrowse(){ this.onHosts=null; },
  async closeAll(){ const c=this.client; this.lobby=null; this.lobbyReady=null; this.inbox=null; this.hosts={}; if(c) await c.removeAllChannels(); },
};
// Lokal testtransport (samma webbläsare, flera flikar) – används bara med ?testnet=1
const SigTest = {
  bc:null, hosts:{}, info:null, onMsg:null, onHosts:null,
  init(){ if(this.bc) return; this.bc=new BroadcastChannel('jaktmarken-testnet');
    this.bc.onmessage=e=>{ const m=e.data;
      if(m.k==='host'){ if(m.id!==Net.myId){ this.hosts[m.id]={...m.info, seen:Date.now()}; this.emit(); } }
      else if(m.k==='unhost'){ delete this.hosts[m.id]; this.emit(); }
      else if(m.k==='sig' && m.to===Net.myId) this.onMsg&&this.onMsg(m.payload); };
    setInterval(()=>{ if(this.info) this.bc.postMessage({k:'host',id:Net.myId,info:this.info}); const now=Date.now(); for(const k in this.hosts) if(now-this.hosts[k].seen>3000){ delete this.hosts[k]; this.emit(); } },500); },
  emit(){ this.onHosts&&this.onHosts({...this.hosts}); },
  async ensureInbox(){ this.init(); },
  async send(to,payload){ this.init(); this.bc.postMessage({k:'sig',to,payload:{...payload,to}}); },
  async host(info){ this.init(); this.info=info; this.bc.postMessage({k:'host',id:Net.myId,info}); },
  async unhost(){ this.init(); this.info=null; this.bc.postMessage({k:'unhost',id:Net.myId}); },
  async browse(cb){ this.init(); this.onHosts=cb; cb({...this.hosts}); },
  stopBrowse(){ this.onHosts=null; },
  async closeAll(){},
};
const Sig = TESTNET ? SigTest : SigSupa;

const Net = {
  myId: uid()+uid(), role:null, open:false, hostId:null, peers:{}, joining:false,
  hosts:{}, browsing:false, status:'', waiters:{}, pendingItems:0,
  sendT:0, monT:0, lookDirty:true, lookT:0,
};
Sig.onMsg = msg => onSignal(msg);
const readyPeers = () => Object.values(Net.peers).filter(p=>p.ready);
const isHostNet  = () => Net.role==='host' && readyPeers().length>0;
const isGuestNet = () => Net.role==='guest' && !!Net.hostId && !!(Net.peers[Net.hostId] && Net.peers[Net.hostId].ready);
const inParty    = () => isHostNet() || isGuestNet();
function netMemberIds(){ return Net.role==='host' ? [Net.myId, ...readyPeers().map(p=>p.id)] : [Net.myId, ...Object.keys(G.others)]; }
function netSend(peer,msg){ try{ if(peer && peer.dc && peer.dc.readyState==='open') peer.dc.send(JSON.stringify(msg)); }catch(e){} }
function netTo(id,msg){ netSend(Net.peers[id],msg); }
function netToHost(msg){ netSend(Net.peers[Net.hostId],msg); }
function netToGuests(msg,except){ for(const p of readyPeers()) if(p.id!==except) netSend(p,msg); }
function netBroadcast(msg){ if(Net.role==='host') netToGuests(msg); else if(Net.role==='guest') netToHost(msg); }

// --- Utseende & position ---
function myLook(){
  const ch=G.ch, eq={};
  for(const k of ['vapen','hjalm','mantel','axel','handskar','skor','byxor','brost','balte','halsband']){ const it=ch.eq[k]; if(it) eq[k]={wtype:it.wtype, req:it.req, rarity:it.rarity}; }
  return {id:Net.myId, name:ch.name, cls:ch.cls, lvl:ch.level, eq, db:tv('k_drop')};
}
function lookOf(id){ const o=G.others[id]; return o?{id, name:o.name, cls:o.cls, lvl:o.lvl, eq:o.eq, db:o.db}:null; }
function applyLook(L){
  if(!L || L.id===Net.myId) return;
  const o = G.others[L.id] || (G.others[L.id]={x:0,y:0,tx:0,ty:0,face:1,pose:'stand',t:0,walkT:0,climbT:0,hp:1,mhp:1,seen:false});
  Object.assign(o,{id:L.id, name:L.name, cls:L.cls, lvl:L.lvl, eq:L.eq||{}, db:L.db||0});
}
function myState(){
  const p=G.p, ch=G.ch; let pose='stand';
  if(p.dead) pose='dead'; else if(p.climb) pose='climb'; else if(p.atkAnim>0) pose=p.atkMode; else if(!p.onGround) pose='jump'; else if(Math.abs(p.vx)>1) pose='walk';
  return {t:'p', id:Net.myId, x:Math.round(p.x), y:Math.round(p.y), f:p.face, po:pose, k:p.atkAnim>0?+(1-p.atkAnim/p.atkDur).toFixed(2):0, w:+p.walkT.toFixed(2), c:+p.climbT.toFixed(2), hp:Math.ceil(ch.hp), mhp:G.stats.maxHp, b:p.buffT>0?1:0, m:G.mapId};
}
function applyState(S){
  const o=G.others[S.id]; if(!o) return;
  if(!o.seen || o.map!==S.m){ o.x=S.x; o.y=S.y; o.seen=true; }
  Object.assign(o,{tx:S.x, ty:S.y, face:S.f, pose:S.po, t:S.k, walkT:S.w, climbT:S.c, hp:S.hp, mhp:S.mhp, buff:S.b, map:S.m, last:G.time});
}

// --- Monster (värden skickar ögonblicksbilder ~10 ggr/s) ---
function monSnap(){ return {t:'mon', m:G.monsters.filter(m=>!m.dead).map(m=>[m.id, MOB_ORDER.indexOf(m.type), PLATS.indexOf(m.plat), Math.round(m.x), Math.round(m.hp*10)/10, m.dir, m.hurtT>0?2:(m.state==='walk'?1:0), (m.burn?1:0)|(m.spawnT>0?2:0)|(m.rare?4:0)])}; }
function applyMonSnap(arr){
  const seen=new Set();
  for(const [id,ti,pi,x,hp,dir,st,fl] of arr){
    seen.add(id); let m=G.monById[id];
    if(!m){ const type=MOB_ORDER[ti], rare=!!(fl&4), d=mobDef(type,rare), plat=PLATS[pi]; if(!d||!plat) continue;
      if(rare && (fl&2)) log(`✦ En <b style="color:#e8eef6">${d.name}</b> har dykt upp!`,'#cfd8e6');
      m={id, type, d, sp:null, plat, x, tx:x, y:plat.y, hp, maxHp:d.hp, dir, state:'idle', timer:0, t:rand(0,10), rot:0, kb:0, kbT:0, hurtT:0, showHp:0, dead:false, dieT:0, spawnT:(fl&2)?0.5:0, burn:null, stack:0, stackT:-9, rare};
      G.monById[id]=m; G.monsters.push(m); }
    if(m.dead) continue;
    m.tx=x; m.hp = (m.predT>G.time) ? Math.min(m.hp,hp) : hp;
    if(m.pend && hp>0 && !(m.predT>G.time)) m.pend=false;
    if(st===2){ if(!(m.hurtT>0)) m.hurtT=0.25; } else m.state = st===1?'walk':'idle';
    if(!(m.hurtT>0)) m.dir=dir;
    m.burning=!!(fl&1);
  }
  for(const m of G.monsters) if(!m.dead && !seen.has(m.id)){ m.dead=true; m.dieT=0.6; }
}

// --- Drops över nätet ---
function dropMsg(d){ return {id:d.id, kind:d.kind, amount:d.amount, item:d.item, x:Math.round(d.x), y:Math.round(d.y), vx:d.landed?0:Math.round(d.vx), vy:d.landed?0:Math.round(d.vy), plat:d.plat.id, owner:d.owner, left:d.owner?Math.max(0,d.ownerT-G.time):0, landed:d.landed, bb:d.blockBy, bl:d.blockBy?Math.max(0,d.blockT-G.time):0}; }
function guestOnDrop(dm){
  if(G.drops.some(x=>x.id===dm.id)) return;
  G.drops.push({id:dm.id, kind:dm.kind, amount:dm.amount, item:dm.item, x:dm.x, y:dm.y, vx:dm.vx, vy:dm.vy, plat:platById[dm.plat]||platById.g1, landed:dm.landed, born:G.time, life:120, t:rand(0,6), picking:false, pickT:0, owner:dm.owner, ownerT:G.time+(dm.left||0), blockBy:dm.bb||null, blockT:G.time+(dm.bl||0)});
}
function guestOnGone(id, by){
  const i=G.drops.findIndex(x=>x.id===id); if(i<0) return;
  const d=G.drops[i]; if(by){ d.picking=true; d.pickT=0; d.by=by; d.applied=true; } else G.drops.splice(i,1);
}
function hostOnPick(from, id){
  const d=G.drops.find(x=>x.id===id); if(!d || d.picking || blockedFor(d, from)) return;
  if(!canPick(d, from)){ netTo(from,{t:'deny', id, owner:d.owner, left:Math.ceil(d.ownerT-G.time)}); return; }
  d.picking=true; d.pickT=0; d.by=from; d.applied=true;
  netToGuests({t:'gone', id, by:from});
  if(d.kind==='gold') splitGold(d.amount); else netTo(from,{t:'item', item:d.item});
}

// --- Kosmetiska skott & effekter från andra ---
function netShot(pr){ if(!inParty()) return; netBroadcast({t:'shot', id:Net.myId, ty:pr.type, x:Math.round(pr.x), y:Math.round(pr.y), vx:Math.round(pr.vx), vy:Math.round(pr.vy), sp:pr.speed, h:pr.homing, tid:pr.target?pr.target.id:0, md:Math.round(Math.min(pr.maxDist,2000))}); }
function spawnCosShot(S){ if(S.id===Net.myId) return; G.projs.push({type:S.ty, cos:true, x:S.x, y:S.y, vx:S.vx, vy:S.vy, speed:S.sp, homing:S.h, target:G.monById[S.tid]||null, dist:0, maxDist:S.md, life:1.6, hit:new Set()}); }
function netFx(k,x,y){ if(inParty()) netBroadcast({t:'fx', id:Net.myId, k, x:Math.round(x), y:Math.round(y)}); }
function spawnNetFx(S){ if(S.id===Net.myId) return; if(S.k==='beam') G.fx.push({type:'beam', x:S.x, y:S.y, t:0, dur:1.6}); else if(S.k==='radial') G.fx.push({type:'radial', x:S.x, y:S.y, t:0, dur:.4}); }

// --- Meddelanden ---
function netOnData(peer, msg){
  const from=peer.id;
  if(Net.role==='host'){
    switch(msg.t){
      case 'hello': return hostOnHello(peer, msg);
      case 'p':     if(!peer.ready) return; msg.id=from; applyState(msg); return netToGuests(msg, from);
      case 'look':  msg.id=from; applyLook(msg); return netToGuests({...msg, t:'look'}, from);
      case 'hit':   { const m=G.monById[msg.id]; if(m && !m.dead) hitMonster(m, +msg.d||0, {dir:msg.dir, kind:msg.k||undefined, noKb:!!msg.nk, by:from, burn:msg.b||null, noBurn:!msg.b}); return; }
      case 'pick':  return hostOnPick(from, msg.id);
      case 'dropItem':{ const pl=platById[msg.plat]||platById.g1; spawnDrop({x:msg.x, y:pl.y, d:{h:40}, plat:pl}, {kind:'item', item:msg.item, block:from}, msg.f||1); return; }
      case 'redrop':{ const pl=platById[msg.plat]||platById.g1; spawnDrop({x:msg.x, y:pl.y, d:{h:20}, plat:pl}, {kind:'item', item:msg.item, owner:from}); return; }
      case 'shot':  msg.id=from; spawnCosShot(msg); return netToGuests(msg, from);
      case 'fx':    msg.id=from; spawnNetFx(msg); return netToGuests(msg, from);
      case 'bye':   return netRemovePeer(from,'left');
    }
  } else if(Net.role==='guest'){
    switch(msg.t){
      case 'welcome': return guestOnWelcome(msg);
      case 'p':     return applyState(msg);
      case 'look':  return applyLook(msg);
      case 'left':  { const n=nameOf(msg.id); delete G.others[msg.id]; log(`👥 ${esc(n)} lämnade partyt.`,'#9fe0ff'); return refreshParty(); }
      case 'mon':   return applyMonSnap(msg.m);
      case 'dmg':   { if(msg.by===Net.myId) return; const m=G.monById[msg.id]; if(m && !m.dead){ addNum(m.x, m.y-m.d.h-6, msg.v, msg.k||'dmg', m); m.showHp=4; sparks(m.x, m.y-m.d.h/2, msg.k==='burn'?'#ff9a3a':'#fff3b0', msg.k==='burn'?2:4); } return; }
      case 'kill':  { const m=G.monById[msg.id]; if(m && !m.dead){ m.dead=true; m.dieT=0.6; } return; }
      case 'drop':  return guestOnDrop(msg.d);
      case 'gone':  return guestOnGone(msg.id, msg.by);
      case 'exp':   return gainKillExp(msg.ty, msg.s, true, !!msg.kill, msg.x||1);
      case 'gold':  return addGold(msg.a, true);
      case 'item':  Net.pendingItems=Math.max(0,Net.pendingItems-1); return receiveItem(msg.item);
      case 'deny':  Net.pendingItems=Math.max(0,Net.pendingItems-1); return throttleMsg('deny',`Föremålet tillhör ${esc(ownerName(msg.owner))} i ${msg.left} s till.`,'#ff9b9b');
      case 'map':   return guestEnterMap(msg.to, msg.x, msg.y, true);
      case 'shot':  return spawnCosShot(msg);
      case 'fx':    return spawnNetFx(msg);
      case 'bye':   return netRemovePeer(from,'host-left');
    }
  }
}
function hostOnHello(peer, msg){
  if(msg.v!==NET_VER || !msg.look){ netSend(peer,{t:'bye'}); return netRemovePeer(peer.id,'version',true); }
  if(readyPeers().length>=PARTY_MAX-1){ netSend(peer,{t:'bye'}); return netRemovePeer(peer.id,'full',true); }
  peer.ready=true; peer.name=msg.look.name;
  applyLook({...msg.look, id:peer.id});
  const pl=(G.p.onGround&&G.p.plat)?G.p.plat:null, st=curMap().start;
  const looks=[myLook(), ...readyPeers().filter(p=>p.id!==peer.id).map(p=>lookOf(p.id)).filter(Boolean)];
  netSend(peer,{t:'welcome', host:Net.myId, map:G.mapId, x:Math.round(pl?G.p.x:st.x), y:pl?pl.y:st.y, looks, drops:G.drops.filter(d=>!d.picking).map(dropMsg)});
  netSend(peer, monSnap());
  netToGuests({...msg.look, t:'look', id:peer.id}, peer.id);
  log(`👥 <b>${esc(peer.name)}</b> gick med i partyt!`,'#9fe0ff'); toast(`👥 ${esc(peer.name)} gick med i partyt`);
  hostUpdatePresence(); refreshParty();
}
function guestOnWelcome(msg){
  for(const L of msg.looks||[]) applyLook(L);
  guestEnterMap(msg.map, msg.x, msg.y, false);
  for(const dm of msg.drops||[]) guestOnDrop(dm);
  const hn=nameOf(msg.host);
  toast(`👥 Du är med i <b>${esc(hn)}</b>s party!`); log(`👥 Du gick med i ${esc(hn)}s party. +5% EXP i party.`,'#9fe0ff');
  refreshParty();
}
function guestEnterMap(to, x, y, announce){
  if(!MAPS[to] || !G.p) return;
  G.mapId=to; G.ch.map=to;
  const keep={cds:G.p.cds, cdMax:G.p.cdMax, buffT:G.p.buffT, dead:G.p.dead};
  G.p=makePlayer(x,y); Object.assign(G.p,keep); G.p.portalCd=0.8;
  G.monsters=[]; G.monById={}; G.spawns=[]; G.drops=[]; G.projs=[]; G.nums=[];
  $('#mapName').textContent=curMap().name; snapCam();
  if(announce){ toast(`🌀 <b>${curMap().name}</b> – partyt följer ledaren`); log(`Partyt gick till <b>${curMap().name}</b>.`,'#ffe9a8'); }
  markDirty(true);
}

// --- Uppkoppling (WebRTC) ---
function iceDone(pc){ return new Promise(res=>{ if(pc.iceGatheringState==='complete') return res(); const t=setTimeout(res,2500); pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } }); }); }
function dcOpen(dc,ms){ return new Promise((res,rej)=>{ if(dc.readyState==='open') return res(); const t=setTimeout(()=>rej(new Error('Ingen direktkontakt (P2P) kunde skapas – prova ett annat nätverk.')),ms); dc.addEventListener('open',()=>{ clearTimeout(t); res(); }); }); }
function sigWait(from,ms){ return new Promise((res,rej)=>{ const t=setTimeout(()=>{ delete Net.waiters[from]; rej(new Error('Inget svar från värden.')); },ms); Net.waiters[from]={resolve:m=>{ clearTimeout(t); res(m); }}; }); }
function netAddPeer(id, pc){
  const peer={id, pc, dc:null, ready:false}; Net.peers[id]=peer;
  pc.onconnectionstatechange=()=>{ if(['failed','closed'].includes(pc.connectionState)) netRemovePeer(id,'lost'); };
  return peer;
}
function netBindDc(peer, dc){
  peer.dc=dc;
  dc.onopen=()=>{ if(Net.role==='guest'){ peer.ready=true; netSend(peer,{t:'hello', v:NET_VER, look:myLook()}); } };
  dc.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; } try{ netOnData(peer,m); }catch(err){ console.error(err); } };
  dc.onclose=()=>netRemovePeer(peer.id,'closed');
}
async function onSignal(msg){
  if(!msg || msg.from===Net.myId || (msg.to && msg.to!==Net.myId)) return;
  if(msg.t==='answer' || msg.t==='reject'){ const w=Net.waiters[msg.from]; if(w){ delete Net.waiters[msg.from]; w.resolve(msg); } return; }
  if(msg.t!=='offer' || Net.role!=='host') return;
  const total=1+Object.keys(Net.peers).length;
  const why = msg.v!==NET_VER ? 'Ni har olika versioner av spelet – ladda om sidan (Ctrl+F5).' : !Net.open||G.mode!=='game' ? 'Partyt är stängt för nya spelare.' : total>=PARTY_MAX ? 'Partyt är fullt.' : '';
  if(why){ Sig.send(msg.from,{t:'reject', from:Net.myId, reason:why}).catch(()=>{}); return; }
  try{
    const pc=new RTCPeerConnection(rtcConf()), peer=netAddPeer(msg.from, pc); peer.name=msg.name;
    pc.ondatachannel=e=>netBindDc(peer, e.channel);
    await pc.setRemoteDescription({type:'offer', sdp:msg.sdp});
    await pc.setLocalDescription(await pc.createAnswer()); await iceDone(pc);
    await Sig.send(msg.from,{t:'answer', from:Net.myId, sdp:pc.localDescription.sdp});
    setTimeout(()=>{ const p=Net.peers[msg.from]; if(p && !p.ready) netRemovePeer(msg.from,'timeout',true); },25000);
  }catch(e){ console.warn(e); netRemovePeer(msg.from,'fail',true); }
}
function hostInfo(){ return {host:1, v:NET_VER, name:G.ch.name, cls:G.ch.cls, lvl:G.ch.level, map:curMap().name, n:1+readyPeers().length}; }
function hostUpdatePresence(){
  if(Net.role!=='host' || !G.ch) return;
  if(Net.open && 1+readyPeers().length<PARTY_MAX) Sig.host(hostInfo()).catch(e=>console.warn(e));
  else Sig.unhost().catch(()=>{});
}
async function netHost(){
  if(Net.role) return;
  if(!Cloud.on && !TESTNET){ toast('Multiplayer kräver Supabase-inställningarna.'); return; }
  Net.role='host'; Net.open=true; Net.peers={}; G.others={}; Net.status='Öppnar…'; refreshParty();
  try{ await Sig.host(hostInfo()); Net.status=''; log('🌐 Din karta är nu öppen – andra kan gå med via 👥.','#9fe0ff'); }
  catch(e){ Net.role=null; Net.open=false; Net.status=''; toast('⚠️ Kunde inte öppna: '+esc(e.message||String(e)),5000); }
  refreshParty();
}
async function netJoin(hostId){
  if(Net.role) return;
  Net.role='guest'; Net.joining=true; Net.hostId=hostId; G.others={}; refreshParty();
  try{
    await Sig.ensureInbox();
    const pc=new RTCPeerConnection(rtcConf()), dc=pc.createDataChannel('jm',{ordered:true});
    const peer=netAddPeer(hostId, pc); netBindDc(peer, dc);
    await pc.setLocalDescription(await pc.createOffer()); await iceDone(pc);
    const wait=sigWait(hostId,15000);
    await Sig.send(hostId,{t:'offer', from:Net.myId, sdp:pc.localDescription.sdp, v:NET_VER, name:G.ch.name});
    const ans=await wait;
    if(ans.t==='reject') throw new Error(ans.reason||'Värden tackade nej.');
    await pc.setRemoteDescription({type:'answer', sdp:ans.sdp});
    await dcOpen(dc,15000);
    Net.joining=false; Sig.stopBrowse(); Sig.closeAll().catch(()=>{});   // gästen behöver inte Supabase längre
  }catch(e){
    Net.joining=false;
    if(Net.peers[hostId]) netRemovePeer(hostId,'fail',true);
    Net.role=null; Net.hostId=null;
    toast('⚠️ Kunde inte ansluta: '+esc(e.message||String(e)),6000);
  }
  refreshParty();
}
function netRemovePeer(id, why, silent){
  const p=Net.peers[id]; if(!p) return;
  delete Net.peers[id];
  try{ p.dc&&p.dc.close(); }catch(_){} try{ p.pc.close(); }catch(_){}
  const name=(G.others[id]&&G.others[id].name)||p.name||'En spelare';
  delete G.others[id];
  if(Net.role==='host'){
    if(p.ready && !silent){ log(`👥 ${esc(name)} lämnade partyt.`,'#9fe0ff'); netToGuests({t:'left', id}); }
    hostUpdatePresence();
  } else if(Net.role==='guest' && id===Net.hostId){
    const was=p.ready;
    Net.role=null; Net.hostId=null; G.others={};
    for(const k of Object.keys(Net.peers)) netRemovePeer(k,'x',true);
    if(was && !silent && G.mode==='game'){ toast('👥 Partyt upplöstes – du spelar vidare själv.'); log('👥 Partyt upplöstes.','#9fe0ff'); initSpawns(); G.drops=[]; G.projs=[]; }
  }
  refreshParty();
}
function netLeave(quiet){
  if(!Net.role) return;
  const wasGuest = Net.role==='guest';
  if(Net.role==='host') netToGuests({t:'bye'}); else netToHost({t:'bye'});
  for(const id of Object.keys(Net.peers)) netRemovePeer(id,'leave',true);
  Net.role=null; Net.open=false; Net.hostId=null; Net.joining=false; G.others={};
  Sig.unhost().catch(()=>{}); Sig.stopBrowse(); Sig.closeAll().catch(()=>{});
  if(wasGuest && !quiet && G.mode==='game'){ initSpawns(); G.drops=[]; G.projs=[]; }
  if(!quiet) log('👥 Du lämnade partyt.','#9fe0ff');
  refreshParty();
}
function netTick(dt){
  if(!Net.role || G.mode!=='game' || !G.p) return;
  for(const o of Object.values(G.others)){ const k=Math.min(1,dt*12); o.x+=(o.tx-o.x)*k; o.y+=(o.ty-o.y)*k; }
  if(!inParty()) return;
  Net.sendT-=dt; if(Net.sendT<=0){ Net.sendT=1/15; netBroadcast(myState()); }
  if(Net.lookDirty){ Net.lookT-=dt; if(Net.lookT<=0){ Net.lookDirty=false; Net.lookT=0.5; netBroadcast({...myLook(), t:'look'}); } }
  if(Net.role==='host'){ Net.monT-=dt; if(Net.monT<=0){ Net.monT=0.1; netToGuests(monSnap()); } }
}

// --- Party-fönster & HUD ---
function partyWindowOpened(){ if(!Net.role) startBrowse(); }
function partyWindowClosed(){ if(!Net.role){ Sig.stopBrowse(); Net.browsing=false; setTimeout(()=>{ if(!Net.role && !isOpen('party')) Sig.closeAll().catch(()=>{}); },1500); } }
function startBrowse(){
  if(!Cloud.on && !TESTNET) return;
  Net.status='Letar efter öppna spel…'; Net.browsing=false;
  Sig.browse(h=>{ Net.hosts=h; Net.browsing=true; Net.status=''; if(isOpen('party')) renderParty(); })
     .catch(e=>{ Net.status='Kunde inte nå lobbyn: '+(e.message||e); if(isOpen('party')) renderParty(); });
}
function refreshParty(){ if(isOpen('party')) renderParty(); }
function memberListHtml(){
  const rows=[{name:G.ch.name+' (du)', cls:G.ch.cls, lvl:G.ch.level, lead:Net.role==='host'}];
  for(const o of Object.values(G.others)) rows.push({name:o.name, cls:o.cls, lvl:o.lvl, lead:o.id===Net.hostId});
  return `<div class="plist">${rows.map(r=>`<div class="prow">${r.lead?'👑 ':''}<b>${esc(r.name||'?')}</b> <small>Lv ${r.lvl||'?'} ${CLASSES[r.cls]?CLASSES[r.cls].name:''}</small></div>`).join('')}</div>`;
}
function renderParty(){
  if(!G.ch) return;
  let h=`<div class="shopinfo" style="max-width:none">Spela tillsammans med upp till ${PARTY_MAX} personer. I party får alla <b>+5% EXP</b>. Den som dödar ett monster får <b>75%</b> av dess EXP och övriga i partyt <b>30%</b> var. Guld som plockas upp delas lika. Föremål som droppas tillhör den som dödade monstret i 1 minut. Partyt följer ledaren genom portaler.</div>`;
  if(!Cloud.on && !TESTNET){ h+=`<div class="warn" style="font-size:13px">Multiplayer behöver Supabase-inställningarna för att ni ska hitta varandra. Själva spelandet går sedan direkt mellan er (P2P).</div>`; $('#partyBody').innerHTML=h; return; }
  if(Net.role==='host'){
    const n=1+readyPeers().length;
    h+=`<div class="pstat">👑 Du är party-ledare · ${n}/${PARTY_MAX} spelare · ${!Net.open?'Stängd för nya spelare':n>=PARTY_MAX?'Partyt är fullt':'Öppen – andra kan gå med'}</div>`+memberListHtml();
    h+=`<div class="row" style="margin-top:8px">${Net.open?`<button class="btn sm sec" data-pa="close">Stäng för nya spelare</button>`:`<button class="btn sm" data-pa="open">Öppna för nya spelare</button>`}<button class="btn sm red" data-pa="end">Avsluta party</button></div>`;
  } else if(Net.role==='guest'){
    if(Net.joining) h+=`<div class="pstat">⏳ Ansluter till ${esc((Net.hosts[Net.hostId]||{}).name||'värden')}…</div>`;
    else h+=`<div class="pstat">👥 Du är med i ${esc(nameOf(Net.hostId))}s party</div>`+memberListHtml()+`<div class="row" style="margin-top:8px"><button class="btn sm red" data-pa="leave">Lämna party</button></div>`;
  } else {
    h+=`<button class="btn green" data-pa="host">🌐 Öppna min karta för andra</button>`;
    h+=`<div style="margin-top:12px;font-weight:800">Öppna spel just nu</div>`;
    if(Net.status) h+=`<div style="color:var(--muted);font-size:12.5px;margin:4px 0">${esc(Net.status)}</div>`;
    const list=Object.entries(Net.hosts).filter(([,x])=>x.v===NET_VER);
    if(!list.length && Net.browsing) h+=`<div style="color:var(--muted);font-size:12.5px;padding:6px 0">Inga öppna spel just nu – listan uppdateras av sig själv.</div>`;
    for(const [id,x] of list) h+=`<div class="srow"><div class="sn"><b>${esc(x.name)}</b><small>Lv ${x.lvl} ${esc(CLASSES[x.cls]?CLASSES[x.cls].name:'')} · ${esc(x.map)} · ${x.n}/${PARTY_MAX} spelare</small></div><button class="btn sm green" data-join="${esc(id)}" ${x.n>=PARTY_MAX?'disabled':''}>Gå med</button></div>`;
  }
  $('#partyBody').innerHTML=h;
}
$('#partyBody').addEventListener('click',e=>{
  const j=e.target.closest('[data-join]'); if(j){ netJoin(j.dataset.join); return; }
  const a=e.target.closest('[data-pa]'); if(!a) return;
  const k=a.dataset.pa;
  if(k==='host') netHost();
  else if(k==='close'){ Net.open=false; Sig.unhost().catch(()=>{}); refreshParty(); }
  else if(k==='open'){ Net.open=true; hostUpdatePresence(); refreshParty(); }
  else if(k==='end' || k==='leave'){ netLeave(); if(isOpen('party')) startBrowse(); }
});
let partyHudKey='';
function renderPartyHud(){
  const el=$('#partyHud');
  if(!inParty()){ if(partyHudKey){ el.classList.add('hidden'); el.innerHTML=''; partyHudKey=''; } return; }
  const rows=Object.values(G.others).map(o=>({n:o.name, l:o.lvl, k:clamp((o.hp||0)/(o.mhp||1),0,1)}));
  const key=JSON.stringify(rows.map(r=>[r.n,r.l,Math.round(r.k*50)]));
  if(key===partyHudKey) return; partyHudKey=key;
  el.classList.remove('hidden');
  el.innerHTML=rows.map(r=>`<div class="pm"><b>${esc(r.n||'?')}</b> <small>Lv ${r.l||'?'}</small><div class="ph"><i style="width:${r.k*100}%"></i></div></div>`).join('');
}

/* =====================================================================
   HUVUDLOOP
   ===================================================================== */
function update(dt){
  G.time+=dt;
  if(G.mode==='game' && G.p){ updatePlayer(dt); checkContact(); }
  updateMonsters(dt); spawnTick(dt); updateProjs(dt); updateDrops(dt); updateFx(dt); netTick(dt); updateCamera(dt);
  if(G.mode==='game'){ hudT-=dt; if(hudT<=0){ hudT=0.1; updateHud(); } }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  try{ update(dt); render(); }catch(e){ console.error(e); }
  requestAnimationFrame(frame);
}

// Start
Cloud.init();
if(matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints>0 && matchMedia('(hover: none)').matches)) setTouch(true);
resize(); initSpawns(); snapCam(); showLogin();
requestAnimationFrame(frame);

// Exponera för felsökning i konsolen
window.JM = {G, Net, MOBS, RARE_DEFS, rollRarityTest:rollRarity, gainKillExpTest:(...a)=>gainKillExp(...a), makeItem, spawnMonsterTest:(sp,inst)=>spawnMonster(sp,inst), BASES, startGame, drawIconTest:drawIcon, drawCharTest:drawChar, spawnTest:sp=>spawnMonster(sp,true), whisperTarget:()=>whisperTarget(), rangedTarget:(r,d,u)=>rangedTarget(r,d,u), recalc:()=>recalc()};
</script>
